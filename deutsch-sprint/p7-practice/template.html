<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f4ef"><title>Deutsch Sprint · C1 补充模考</title>
<style>
:root{color-scheme:light;--canvas:#f5f4ef;--surface:#fffefa;--surface2:#f0efe9;--ink:#1e2925;--muted:#69756f;--line:#dfe2db;--accent:#285e4d;--accentStrong:#174635;--accentSoft:#e4eee8;--gold:#b9773d;--goldSoft:#f6eadc;--red:#a7463b;--redSoft:#f7e8e4;--focus:#ac6b2f;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.app{max-width:1340px;margin:auto;padding:0 25px 48px}.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--accentStrong);color:white;font-size:12px;font-weight:800}.brand strong{font-size:13px}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.top-actions{display:flex;gap:7px}.btn{min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.btn:hover{background:var(--surface2)}.primary{border-color:var(--accentStrong);background:var(--accentStrong);color:white;font-weight:700}.primary:hover{filter:brightness(1.08)}.danger{color:var(--red)}.eyebrow{margin:24px 0 7px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font:500 clamp(26px,3vw,37px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.035em}.lede{margin:9px 0 20px;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:17px;align-items:start}.nav{position:sticky;top:15px;display:grid;gap:6px}.nav-item{width:100%;display:grid;grid-template-columns:29px 1fr;align-items:center;gap:9px;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left}.nav-item:hover{background:var(--surface2)}.nav-item[aria-current=page]{border-color:var(--line);background:var(--surface);box-shadow:0 8px 26px rgba(36,47,41,.05)}.nav-num{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:10px;font-weight:800}.nav-item[aria-current=page] .nav-num{background:var(--accentSoft);color:var(--accentStrong)}.nav-title{font-size:11px;font-weight:700;line-height:1.3}.nav-sub{display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:500}.side-note{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:10px}.main{min-width:0}.task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:19px 21px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 9px 28px rgba(36,47,41,.05)}.task-head h2{margin:0;font:500 24px/1.2 Georgia,"Times New Roman",serif}.task-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.timer-box{min-width:145px;display:grid;justify-items:end;gap:5px}.timer{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.timer-label{color:var(--muted);font-size:10px}.status-pill{display:inline-flex;padding:4px 8px;border-radius:99px;color:var(--muted);background:var(--surface2);font-size:10px;font-weight:700}.status-pill.running{color:var(--gold);background:var(--goldSoft)}.status-pill.done{color:var(--accentStrong);background:var(--accentSoft)}.timer-actions{display:flex;gap:7px;margin-top:7px}.panel{margin-top:13px;padding:20px;border:1px solid var(--line);border-radius:15px;background:var(--surface);box-shadow:0 9px 28px rgba(36,47,41,.04)}.panel h3{margin:0 0 7px;font-size:14px}.panel p{font-size:13px;line-height:1.65}.reading-text{max-width:790px;font:18px/1.8 Georgia,"Times New Roman",serif}.reading-text p{margin:0 0 15px}.reading-text p:last-child{margin-bottom:0}.questions{display:grid;gap:0}.question{padding:13px 0;border-top:1px solid var(--line)}.question:first-child{border-top:0}.question legend{margin-bottom:8px;font-size:13px;font-weight:650}.qtype{margin-right:7px;color:var(--muted);font-size:10px}.option{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:12px;cursor:pointer}.option:hover{background:var(--surface2)}.option input{margin:3px 0 0;accent-color:var(--accentStrong)}.feedback{margin:8px 0 0;padding:9px 10px;border-radius:8px;background:var(--surface2);font-size:11px}.feedback.ok{color:var(--accentStrong);background:var(--accentSoft)}.feedback.no{color:var(--red);background:var(--redSoft)}.feedback p{margin:4px 0 0;color:var(--muted);font-size:11px}.task-prompt{padding:15px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:var(--accentSoft);font-size:14px}.list{display:grid;gap:8px;margin:13px 0;padding:0;list-style:none}.list li{padding:10px 11px;border:1px solid var(--line);border-radius:9px;font-size:12px}.list li::before{content:"•";margin-right:8px;color:var(--accent);font-weight:800}.text-entry{width:100%;min-height:250px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical;font:14px/1.65 ui-sans-serif,system-ui,sans-serif}.field-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:9px 0;color:var(--muted);font-size:11px}.reveal{margin-top:12px;padding:13px;border-radius:10px;background:var(--goldSoft);font-size:12px}.reveal h4{margin:0 0 7px}.reveal[hidden]{display:none}.card-select{min-height:40px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.angles{display:grid;grid-template-columns:1fr 1fr;gap:11px}.angle{padding:14px;border-radius:11px;background:var(--accentSoft);font-size:12px}.angle:nth-child(2){background:var(--goldSoft)}.angle strong{display:block;margin-bottom:5px}.reflection{display:grid;gap:8px;margin-top:13px}.reflection label{display:flex;gap:8px;align-items:start;padding:9px;border-radius:8px;background:var(--surface2);font-size:11px}.reflection input{margin-top:2px;accent-color:var(--accentStrong)}.result-summary{padding:13px;border-radius:10px;background:var(--accentSoft);font-size:13px}.result-summary strong{font-size:19px}.empty{padding:20px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;font-size:12px}.notice{padding:12px;border-radius:9px;background:var(--surface2);color:var(--muted);font-size:11px}.script-text{font:15px/1.75 Georgia,"Times New Roman",serif}.hidden{display:none!important}.foot{margin-top:18px;color:var(--muted);text-align:center;font-size:10px}.toast{position:fixed;right:18px;bottom:18px;z-index:30;padding:10px 14px;border-radius:10px;background:#263b31;color:#fff;font-size:12px;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:850px){.app{padding:0 15px 35px}.layout{grid-template-columns:1fr}.nav{position:static;display:flex;gap:5px;overflow-x:auto;margin:0 -15px;padding:0 15px 5px}.nav-item{flex:0 0 190px;width:190px}.side-note{display:none}.task-head{padding:16px}.panel{padding:16px}.angles{grid-template-columns:1fr}.timer-box{min-width:110px}.timer{font-size:21px}}@media(max-width:440px){.brand small{display:none}.top-actions .btn{min-height:36px;padding:0 9px;font-size:10px}.task-head{align-items:flex-start;flex-direction:column}.timer-box{width:100%;justify-items:start}.timer-actions{flex-wrap:wrap}.reading-text{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><div class="app" id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script type="application/json" id="exam-data">__EXAM_JSON__</script>
<script>
(()=>{'use strict';const EXAM=JSON.parse(document.getElementById('exam-data').textContent),KEY='deutschSprint.p7.v1';let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}let currentId=store.currentId||EXAM.sections[0].id,attempts=store.attempts||{},timer=null;const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const section=()=>EXAM.sections.find(s=>s.id===currentId)||EXAM.sections[0];const attempt=()=>attempts[currentId]||{};function persist(){try{localStorage.setItem(KEY,JSON.stringify({currentId,attempts}))}catch{toast('本地存储失败。')}}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function sentences(text){return text.split(/\n+/).flatMap(p=>p.trim().split(/(?<=[.!?。！？])\s+(?=[„A-ZÄÖÜ])/).map(s=>s.trim()).filter(Boolean))}function started(a){return Boolean(a.startedAt&&!a.submittedAt)}function remaining(a,s){return Math.max(0,Math.ceil((a.expiresAt-Date.now())/1000))}function timeText(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function wordCount(text){return (text.trim().match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu)||[]).length}function modeStatus(a,s){if(a.submittedAt)return '<span class="status-pill done">已提交</span>';if(a.startedAt)return '<span class="status-pill running">限时进行中</span>';return '<span class="status-pill">尚未开始</span>'}function timerHtml(a,s){const seconds=a.startedAt?remaining(a,s):s.duration_minutes*60;const time=a.submittedAt?'已结束':timeText(seconds);return `<div class="timer-box"><span class="timer" id="timer" aria-live="off">${time}</span><span class="timer-label">${a.startedAt&&!a.submittedAt?'剩余时间':`限时 ${s.duration_minutes} 分钟`} · ${modeStatus(a,s)}</span><div class="timer-actions">${!a.startedAt?'<button class="btn primary" data-action="start">开始限时练习</button>':!a.submittedAt?'<button class="btn primary" data-action="submit">提前提交</button>':'<button class="btn danger" data-action="reset">重置本次练习</button>'}</div></div>`}
function objectiveQuestions(s,a){const answers=a.answers||{},locked=Boolean(a.submittedAt)||!started(a);return `<section class="panel"><h3>作答</h3><div class="questions">${s.questions.map((q,i)=>{const answer=answers[i];let feedback='';if(a.submittedAt){const ok=answer===q.answer;const ev=sentences(s.text||s.transcript)[q.evidence_sentence_index]||'';feedback=`<div class="feedback ${ok?'ok':'no'}"><strong>${ok?'正确':'未答对'}</strong> · 参考答案：${esc(q.answer)}<p>证据句：${esc(ev)}</p></div>`}return `<fieldset class="question" style="border-left:0;border-right:0;border-bottom:0;margin:0;padding-left:0;padding-right:0" ${locked?'disabled':''}><legend><span class="qtype">${esc(q.type)} · ${i+1}</span>${esc(q.q)}</legend>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q-${i}" value="${esc(o)}" data-answer="${i}" ${answer===o?'checked':''} ${locked?'disabled':''}><span>${esc(o)}</span></label>`).join('')}${feedback}</fieldset>`}).join('')}</div>${!a.submittedAt?`<button class="btn primary" data-action="submit" ${started(a)?'':'disabled'}>提交并自动计分</button>${!started(a)?'<p class="help" style="margin-top:8px">开始计时后即可作答。</p>':''}`:`<div class="result-summary"><strong>${a.score}/${s.questions.length}</strong> · ${Math.round(a.score/s.questions.length*100)}% 正确</div>`}</section>`}
function readingView(s,a){return `<section class="panel"><div class="task-prompt">${esc(s.title)} · C1 原创补充练习</div><article class="reading-text" lang="de" style="margin-top:14px">${s.text.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}</article></section>${objectiveQuestions(s,a)}`}
function listeningView(s,a){const active=started(a);return `<section class="panel"><h3>听力材料</h3><p class="help">${s.fictional?'虚构情境练习。':''}按 40 分钟限时练习完成理解题。可使用设备的德语系统语音朗读；不同设备的语音可能使用在线服务。</p>${active?`<button class="btn" data-action="speak-script">播放听力稿（系统语音）</button> <span class="tiny" id="speech-status"></span>`:'<div class="notice">开始后可播放听力稿。若设备未安装德语语音，可请他人朗读或使用自己的合法音频材料。</div>'}${a.submittedAt?`<details style="margin-top:13px"><summary>查看听力稿与逐段证据</summary><article class="script-text" lang="de">${s.transcript.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}</article></details>`:''}</section>${objectiveQuestions(s,a)}`}
function writingView(s,a){const response=a.response||'';return `<section class="panel"><h3>写作任务</h3><div class="task-prompt">${esc(s.task)}</div><h3 style="margin-top:17px">必须覆盖的要点</h3><ul class="list">${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><label for="writing-response" class="tiny">你的作文</label><textarea class="text-entry" id="writing-response" placeholder="在计时开始后写作…" ${started(a)&&!a.submittedAt?'':'disabled'}>${esc(response)}</textarea><div class="field-row"><span id="word-count">${wordCount(response)} 词</span><span>写作质量请交由 P4 批改；这里不伪造语言分数。</span></div>${a.submittedAt?`<div class="result-summary">已提交 · ${a.wordCount||0} 词。下面的结构仅供自查，不是范文。</div><div class="reveal"><h4>参考结构</h4><ol>${s.structure.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h4>自查：是否覆盖任务要点</h4><div class="reflection">${s.points.map((p,i)=>`<label><input type="checkbox" data-selfcheck="${i}" ${a.selfcheck?.[i]?'checked':''}><span>${esc(p)}</span></label>`).join('')}</div></div>`:''}</section>`}
function speakingView(s,a){const chosen=Number.isInteger(a.cardIndex)?a.cardIndex:0;const card=s.cards[chosen];return `<section class="panel"><div class="field-row"><div><h3>选择一张话题卡</h3><p class="help">准备立场与理由，再做 2–3 分钟独白和反方讨论。</p></div><select class="card-select" id="card-select" ${a.submittedAt?'disabled':''}>${s.cards.map((c,i)=>`<option value="${i}" ${i===chosen?'selected':''}>话题 ${i+1} / ${s.cards.length}</option>`).join('')}</select></div><div class="task-prompt" lang="de">${esc(card.topic)}</div><div class="angles" style="margin-top:12px"><div class="angle"><strong>角度 A</strong><span lang="de">${esc(card.pro)}</span></div><div class="angle"><strong>角度 B</strong><span lang="de">${esc(card.contra)}</span></div></div><label for="speaking-notes" class="tiny" style="display:block;margin-top:16px">关键词笔记（练习时可以留空）</label><textarea class="text-entry" id="speaking-notes" style="min-height:115px" placeholder="支持观点、让步、反驳、总结…" ${started(a)&&!a.submittedAt?'':'disabled'}>${esc(a.notes||'')}</textarea>${a.submittedAt?`<div class="result-summary">本次计时完成 · 关键词 ${wordCount(a.notes||'')} 词。口语质量请用 P3 或真人导师复盘。</div><div class="reflection"><label><input type="checkbox" data-selfcheck="0" ${a.selfcheck?.[0]?'checked':''}><span>我给出了清楚立场与至少两个理由。</span></label><label><input type="checkbox" data-selfcheck="1" ${a.selfcheck?.[1]?'checked':''}><span>我回应了相反角度并做出总结。</span></label></div>`:''}</section>`}
function render(){const s=section(),a=attempt();document.title=`${s.title} · C1 补充模考`;const nav=EXAM.sections.map((item,i)=>`<button class="nav-item" data-task="${esc(item.id)}" aria-current="${item.id===s.id?'page':'false'}"><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span class="nav-title">${esc(item.title)}<span class="nav-sub">${item.duration_minutes} 分钟 · ${item.kind==='reading'?'阅读':item.kind==='listening'?'听力':item.kind==='writing'?'写作':'口语'}</span></span></button>`).join('');let body=s.kind==='reading'?readingView(s,a):s.kind==='listening'?listeningView(s,a):s.kind==='writing'?writingView(s,a):speakingView(s,a);app.innerHTML=`<header class="top"><div class="brand"><span class="mark">DS</span><span><strong>Deutsch Sprint</strong><small>C1 supplementary practice</small></span></div><div class="top-actions"><button class="btn" data-action="export">导出练习记录</button></div></header><p class="eyebrow">P7 · ORIGINAL PRACTICE · C1</p><h1>补充模考 · 严格计时</h1><p class="lede">按模块练习；阅读与听力自动计分。原创材料不替代 Goethe 官方 Modelltest。</p><div class="layout"><nav class="nav" aria-label="练习模块">${nav}<div class="side-note">计时从开始后持续运行，刷新页面也会继续。到时自动提交；不可暂停。</div></nav><main class="main"><section class="task-head"><div><span class="status-pill">${s.kind==='reading'?'Lesen':s.kind==='listening'?'Hören':s.kind==='writing'?'Schreiben':'Sprechen'}</span><h2 style="margin-top:9px">${esc(s.title)}</h2><p>${esc(EXAM.label)}</p></div>${timerHtml(a,s)}</section>${body}<p class="foot">原创 AI 练习 · 不代表官方考试题、评分标准或通过结论</p></main></div>`;startTicker();}
function startTicker(){if(timer)clearInterval(timer);timer=setInterval(tick,1000);tick()}
function tick(){const s=section(),a=attempt();const el=document.getElementById('timer');if(!el)return;if(a.startedAt&&!a.submittedAt){const left=remaining(a,s);el.textContent=timeText(left);if(left<=0){finish(true);return}}}
function finish(timedOut=false){const s=section(),a=attempts[currentId];if(!a||!a.startedAt||a.submittedAt)return;if('speechSynthesis'in window)speechSynthesis.cancel();a.submittedAt=Date.now();a.timedOut=timedOut;if(s.kind==='reading'||s.kind==='listening'){a.score=s.questions.reduce((sum,q,i)=>sum+((a.answers?.[i]||'')===q.answer?1:0),0)}else if(s.kind==='writing'){a.wordCount=wordCount(a.response||'')}persist();render();toast(timedOut?'时间到，已自动提交。':'已提交。')}
function start(){const s=section(),a=attempts[currentId]||{answers:{}};if(a.submittedAt){toast('本次已提交，请先重置后再开始。');return}if(!a.startedAt){a.startedAt=Date.now();a.expiresAt=a.startedAt+s.duration_minutes*60000}if(s.kind==='speaking'&&!Number.isInteger(a.cardIndex))a.cardIndex=0;attempts[currentId]=a;persist();render();toast('计时已开始，不可暂停。')}
function reset(){if(!confirm('重置会清除本模块当前作答记录。继续？'))return;delete attempts[currentId];persist();render();toast('本模块已重置。')}
function exportProgress(){const data={schemaVersion:1,exportedAt:new Date().toISOString(),attempts};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`deutsch-sprint-p7-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('练习记录已导出。')}
function speakScript(){const s=section();if(!('speechSynthesis'in window)){toast('此浏览器没有系统语音合成。');return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(s.transcript);utterance.lang='de-DE';const voices=speechSynthesis.getVoices();const german=voices.find(v=>v.lang.toLowerCase().startsWith('de'));if(german)utterance.voice=german;utterance.onstart=()=>{const e=document.getElementById('speech-status');if(e)e.textContent=`播放中 · ${german?german.name:'默认语音'}`};utterance.onerror=()=>{const e=document.getElementById('speech-status');if(e)e.textContent='系统语音播放失败；可请他人朗读。'};speechSynthesis.speak(utterance)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-task]');if(nav){currentId=nav.dataset.task;persist();render();return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='start')start();if(action==='submit')finish(false);if(action==='reset')reset();if(action==='export')exportProgress();if(action==='speak-script')speakScript()});
document.addEventListener('change',e=>{const input=e.target.closest('[data-answer]');if(input){const a=attempts[currentId]||{answers:{}};if(!a.submittedAt){a.answers=a.answers||{};a.answers[input.dataset.answer]=input.value;attempts[currentId]=a;persist()}return}if(e.target.id==='card-select'){const a=attempts[currentId]||{};if(!a.submittedAt){a.cardIndex=Number(e.target.value);attempts[currentId]=a;persist();render()}return}const check=e.target.closest('[data-selfcheck]');if(check){const a=attempts[currentId];a.selfcheck=a.selfcheck||[];a.selfcheck[Number(check.dataset.selfcheck)]=check.checked;persist()}});
document.addEventListener('input',e=>{if(e.target.id==='writing-response'){const a=attempts[currentId]||{answers:{}};if(started(a)&&!a.submittedAt){a.response=e.target.value;attempts[currentId]=a;persist()}const count=document.getElementById('word-count');if(count)count.textContent=`${wordCount(e.target.value)} 词`}if(e.target.id==='speaking-notes'){const a=attempts[currentId]||{};if(started(a)&&!a.submittedAt){a.notes=e.target.value;attempts[currentId]=a;persist()}}});
window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});render();})();
</script></body></html>
