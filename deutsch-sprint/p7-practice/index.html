<style>

*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.app{max-width:1340px;margin:auto;padding:0 25px 48px}.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--accentStrong);color:white;font-size:12px;font-weight:800}.brand strong{font-size:13px}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.top-actions{display:flex;gap:7px}.btn{min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.btn:hover{background:var(--surface2)}.primary{border-color:var(--accentStrong);background:var(--accentStrong);color:white;font-weight:700}.primary:hover{filter:brightness(1.08)}.danger{color:var(--red)}.eyebrow{margin:24px 0 7px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font:500 clamp(26px,3vw,37px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:-.035em}.lede{margin:9px 0 20px;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:17px;align-items:start}.nav{position:sticky;top:15px;display:grid;gap:6px}.nav-item{width:100%;display:grid;grid-template-columns:29px 1fr;align-items:center;gap:9px;padding:10px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left}.nav-item:hover{background:var(--surface2)}.nav-item[aria-current=page]{border-color:var(--line);background:var(--surface);box-shadow:0 8px 26px rgba(36,47,41,.05)}.nav-num{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:10px;font-weight:800}.nav-item[aria-current=page] .nav-num{background:var(--accentSoft);color:var(--accentStrong)}.nav-title{font-size:11px;font-weight:700;line-height:1.3}.nav-sub{display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:500}.side-note{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:10px}.main{min-width:0}.task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:19px 21px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 9px 28px rgba(36,47,41,.05)}.task-head h2{margin:0;font:500 24px/1.2 Georgia,"Times New Roman",serif}.task-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.timer-box{min-width:145px;display:grid;justify-items:end;gap:5px}.timer{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.timer-label{color:var(--muted);font-size:10px}.status-pill{display:inline-flex;padding:4px 8px;border-radius:99px;color:var(--muted);background:var(--surface2);font-size:10px;font-weight:700}.status-pill.running{color:var(--gold);background:var(--goldSoft)}.status-pill.done{color:var(--accentStrong);background:var(--accentSoft)}.timer-actions{display:flex;gap:7px;margin-top:7px}.panel{margin-top:13px;padding:20px;border:1px solid var(--line);border-radius:15px;background:var(--surface);box-shadow:0 9px 28px rgba(36,47,41,.04)}.panel h3{margin:0 0 7px;font-size:14px}.panel p{font-size:13px;line-height:1.65}.reading-text{max-width:790px;font:18px/1.8 Georgia,"Times New Roman",serif}.reading-text p{margin:0 0 15px}.reading-text p:last-child{margin-bottom:0}.questions{display:grid;gap:0}.question{padding:13px 0;border-top:1px solid var(--line)}.question:first-child{border-top:0}.question legend{margin-bottom:8px;font-size:13px;font-weight:650}.qtype{margin-right:7px;color:var(--muted);font-size:10px}.option{displ (--accentSoft);font-size:13px}.result-summary strong{font-size:19px}.empty{padding:20px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;font-size:12px}.notice{padding:12px;border-radius:9px;background:var(--surface2);color:var(--muted);font-size:11px}.script-text{font:15px/1.75 Georgia,"Times New Roman",serif}.hidden{display:none!important}.foot{margin-top:18px;color:var(--muted);text-align:center;font-size:10px}.toast{position:fixed;right:18px;bottom:18px;z-index:30;padding:10px 14px;border-radius:10px;background:#263b31;color:#fff;font-size:12px;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1}

<body><div class="app" id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script type="application/json" id="exam-data">{"schemaVersion":1,"label":"Ergänzende C1-Übung · frei erstellt, keine offiziellen Prüfungsaufgaben","source_note":"Offizielle Richtwerte gemäß Goethe-Institut, Durchführungsbestimmungen Goethe-Zertifikat C1: https://www.goethe.de/pro/relaunch/prf/ar/Durchfuehrungsbestimmungen_C1_neu.pdf. Bitte vor der Anmeldung die aktuelle Prüfungsseite des gewählten Prüfungszentrums prüfen.","sections":[{"id":"lesen","kind":"reading","title":"Lesen · Öffentliche Bibliotheken","duration_minutes":20,"text":"Öffentliche Bibliotheken werden oft vor allem mit der Ausleihe von Büchern verbunden. Diese Sicht beschreibt nur einen Teil ihrer Funktion. Wer einen ruhigen Arbeitsplatz, verlässlichen Internetzugang oder Unterstützung bei der Suche nach Informationen benötigt, kann die Bibliothek ebenfalls nutzen. Dadurch wird sie zu einem Ort, an dem Lernen und gesellschaftliche Teilhabe unabhängig vom privaten Wohnraum möglich werden.\n\nEine solche Öffnung stellt Anforderungen an Gebäude und Personal. Unterschiedliche Bedürfnisse müssen berücksichtigt werden: Manche Besucherinnen und Besucher suchen konzentrierte Stille, andere arbeiten in kleinen Gruppen. Eine klare Zonierung kann helfen, Nutzungskonflikte zu verringern. Sie ersetzt jedoch nicht die Entscheidung darüber, welche Angebote Vorrang haben und zu welchen Zeiten sie zugänglich sind. Werden Regeln ausschließlich aus der Perspektive der Verwaltung festgelegt, besteht die Gefahr, dass bestimmte Gruppen ihre Anliegen nicht wiederfinden.\n\nAuch die digitale Ausstattung ist nicht automatisch inklusiv. Ein öffentliches Gerät kann Zugang schaffen, zugleich aber Fragen zum Datenschutz, zur Barrierefreiheit und zur Unterstützung bei der Bedienung aufwerfen. Bibliotheken sollten deshalb nicht nur Geräte bereitstellen, sondern erklären, welche Hilfe verfügbar ist und welche Daten bei der Nutzung anfallen. Das erfordert Zeit und fachliche Zuständigkeit.\n\nBefürworter einer stärkeren sozialen Rolle argumentieren, Bibliotheken könnten ein niedrigschwelliger Treffpunkt sein. Kritische Stimmen geben zu bedenken, dass eine Institution nicht jede kommunale Aufgabe übernehmen kann. Beide Einwände verdienen Beachtung. Eine Bibliothek ist weder Ersatz für Beratungsstellen noch bloß ein Aufbewahrungsort für Medien. Ihre Stärke liegt darin, verschiedene Angebote an einem vertrauten Ort miteinander zu verbinden.\n\nDemzufolge sollte die Weiterentwicklung nicht allein an der Zahl neuer Geräte gemessen werden. Entscheidend ist, ob Nutzerinnen und Nutzer passende Arbeitsbedingungen vorfinden, verständliche Unterstützung erhalten und an der Gestaltung beteiligt werden. Eine regelmäßige Rückmeldung kann zeigen, welche Angebote tatsächlich gebraucht werden. So bleibt die Bibliothek ein öffentlicher Raum, dessen Nutzen sich im Alltag bewähren muss.","questions":[{"type":"对错","q":"Der Text beschreibt die Ausleihe von Büchern als die einzige wichtige Funktion einer Bibliothek.","options":["对","错"],"answer":"错","evidence_sentence_index":1},{"type":"选择","q":"Was kann eine klare Zonierung leisten?","options":["Sie kann Nutzungskonflikte verringern.","Sie macht Personal vollständig überflüssig.","Sie entscheidet automatisch über Öffnungszeiten."],"answer":"Sie kann Nutzungskonflikte verringern.","evidence_sentence_index":5},{"type":"选择","q":"Warum reicht es laut Text nicht, öffentliche Geräte einfach bereitzustellen?","options":["Nutzende brauchen auch Informationen zu Hilfe, Datenschutz und Bedienung.","Geräte dürfen nur von Mitarbeitenden verwendet werden.","Digitale Angebote machen Rückmeldungen unnötig."],"answer":"Nutzende brauchen auch Informationen zu Hilfe, Datenschutz und Bedienung.","evidence_sentence_index":11},{"type":"对错","q":"Der Text fordert, Bibliotheken sollten sämtliche kommunalen Beratungsaufgaben übernehmen.","options":["对","错"],"answer":"错","evidence_sentence_index":16},{"type":"选择","q":"Woran soll die Weiterentwicklung vor allem gemessen werden?","options":["Daran, ob passende Bedingungen, Unterstützung und Beteiligung vorhanden sind.","An der Anzahl neu gekaufter Geräte.","An der Menge ausgeliehener Medien allein."],"answer":"Daran, ob passende Bedingungen, Unterstützung und Beteiligung vorhanden sind.","evidence_sentence_index":19}],"official_duration_minutes":65},{"id":"hoeren","kind":"listening","title":"Hören · Ein geplanter Bürgerdialog","duration_minutes":15,"fictional":true,"transcript":"Fiktiver Ausschnitt aus einem Bürgerdialog.\n\nSprecherin A: Heute möchten wir besprechen, wie der Bürgerdialog zur Umgestaltung des Platzes vorbereitet wird.\nSprecher B: Dann sollten wir zuerst klären, welche Fragen noch offen sind.\nSprecherin A: Genau. Die Veranstaltung soll keinen fertigen Entwurf nachträglich bestätigen lassen.\nSprecher B: Viele Menschen möchten wissen, ob die Wege für Fußgänger und Fahrräder künftig anders verlaufen.\nSprecherin A: Außerdem gibt es Fragen dazu, wo kleine Veranstaltungen stattfinden können.\nSprecher B: Der Termin ist an einem Dienstagabend im Nachbarschaftshaus geplant.\nSprecherin A: Eine Anmeldung hilft uns bei der Planung, ist aber nicht zwingend.\nSprecher B: Wer an dem Abend nicht kommen kann, darf schriftlich Rückmeldung geben.\nSprecherin A: Wir wollen außerdem einen Online-Zugang anbieten.\nSprecher B: Wie gehen wir mit den Beiträgen um?\nSprecherin A: Wir ordnen sie nach Themen und veröffentlichen keine Namen in der Zusammenfassung.\nSprecher B: Kann ein Vorschlag direkt umgesetzt werden?\nSprecherin A: Nicht unbedingt. Manche Ideen müssen erst auf ihre Folgen und Zuständigkeiten geprüft werden.\nSprecher B: Dann erfährt man trotzdem, was daraus wird?\nSprecherin A: Ja. Wir erklären, welche Hinweise in den nächsten Entwurf einfließen und welche vorerst offenbleiben.\nSprecher B: Das klingt nachvollziehbar.\nSprecherin A: Nach dem Dialog veröffentlichen wir eine kurze Zusammenfassung mit offenen Fragen, nächsten Schritten und Kontakt.\nSprecher B: Der Dialog ersetzt also nicht die formelle Entscheidung.\nSprecherin A: Richtig. Er bringt zusätzliche Perspektiven ein und macht die Abwägung verständlicher.\nSprecher B: Dann wissen die Teilnehmenden auch, wie sie später noch Fragen stellen können.","questions":[{"type":"选择","q":"Was sollte zu Beginn der Vorbereitung geklärt werden?","options":["Welche Fragen noch offen sind.","Welcher Entwurf bereits beschlossen wurde.","Wer den Platz später verwalten wird."],"answer":"Welche Fragen noch offen sind.","evidence_sentence_index":2},{"type":"对错","q":"Eine Anmeldung zum Bürgerdialog ist zwingend erforderlich.","options":["对","错"],"answer":"错","evidence_sentence_index":8},{"type":"选择","q":"Wie werden die Beiträge für die öffentliche Zusammenfassung behandelt?","options":["Sie werden thematisch geordnet und ohne Namen veröffentlicht.","Sie werden mit Namen vollständig ins Internet gestellt.","Sie werden nur mündlich an andere Stellen weitergegeben."],"answer":"Sie werden thematisch geordnet und ohne Namen veröffentlicht.","evidence_sentence_index":12},{"type":"对错","q":"Sprecherin A sagt, dass jeder Vorschlag sofort umgesetzt wird.","options":["对","错"],"answer":"错","evidence_sentence_index":14},{"type":"选择","q":"Welche Aufgabe hat der Bürgerdialog laut dem Gespräch?","options":["Zusätzliche Perspektiven einbringen und die Abwägung verständlicher machen.","Die formelle Entscheidung vollständig ersetzen.","Alle Zuständigkeiten auf die Teilnehmenden übertragen."],"answer":"Zusätzliche Perspektiven einbringen und die Abwägung verständlicher machen.","evidence_sentence_index":22}],"official_duration_minutes":40},{"id":"hoeren-interview","kind":"listening","title":"Hören · Interview zur beruflichen Weiterbildung","duration_minutes":8,"official_duration_minutes":40,"fictional":true,"transcript":"Fiktiver Interviewausschnitt.\n\nSprecherin A: Sie haben nach mehreren Jahren im Einzelhandel eine Weiterbildung begonnen. Was war der Auslöser?\nSprecher B: In meinem Betrieb wurden neue digitale Abläufe eingeführt. Ich wollte verstehen, wie sie geplant werden, statt nur einzelne Programme zu bedienen.\nSprecherin A: Wie ließ sich der Kurs mit Ihrer Arbeit vereinbaren?\nSprecher B: Der Unterricht fand an zwei Abenden statt. Trotzdem musste ich mit meiner Leitung frühzeitig klären, wann ich für Lernphasen weniger Schichten übernehmen konnte.\nSprecherin A: Was hat Ihnen beim Lernen besonders geholfen?\nSprecher B: Wir haben an eigenen Arbeitsfällen geübt. Dadurch konnte ich die Begriffe unmittelbar anwenden und gezielte Fragen stellen.\nSprecherin A: Würden Sie anderen dieselbe Weiterbildung empfehlen?\nSprecher B: Nur nach genauer Prüfung. Man sollte klären, ob die Inhalte zum Berufsziel passen und ob genügend Zeit für die Aufgaben bleibt.","questions":[{"type":"选择","q":"Warum begann Sprecher B die Weiterbildung?","options":["Sprecher B wollte die Planung digitaler Abläufe besser verstehen.","Sprecher B musste den Beruf wechseln.","Sprecher B wollte ausschließlich ein bestimmtes Programm bedienen."],"answer":"Sprecher B wollte die Planung digitaler Abläufe besser verstehen.","evidence_sentence_index":3},{"type":"选择","q":"Was empfiehlt Sprecher B Interessierten vor der Anmeldung?","options":["Inhalte und verfügbares Zeitbudget genau zu prüfen.","Zuerst die Arbeitsstelle zu kündigen.","Nur auf den Unterrichtsort zu achten."],"answer":"Inhalte und verfügbares Zeitbudget genau zu prüfen.","evidence_sentence_index":13}]},{"id":"hoeren-vortrag","kind":"listening","title":"Hören · Kurzvortrag zu Stadtbäumen","duration_minutes":7,"official_duration_minutes":40,"fictional":true,"transcript":"Fiktiver, kurzer Vortragsausschnitt.\n\nSprecher C: Stadtbäume können an heißen Tagen Schatten spenden und die Aufenthaltsqualität eines Platzes verbessern. Ihre Wirkung hängt jedoch vom Standort und von der Pflege ab. Junge Bäume benötigen in trockenen Perioden ausreichend Wasser. Gleichzeitig müssen Leitungen, Wege und die verfügbare Fläche berücksichtigt werden. Eine Pflanzung allein löst daher nicht jedes Problem im Stadtraum. Sinnvoll ist eine längerfristige Planung, die geeignete Arten auswählt und Zuständigkeiten für die Pflege festlegt. Auch die Anwohnerinnen und Anwohner können Hinweise geben, etwa zu besonders heißen Orten oder häufig genutzten Wegen. Solche Rückmeldungen ersetzen keine fachliche Prüfung, können aber bei der Priorisierung helfen.","questions":[{"type":"选择","q":"Wovon hängt die Wirkung von Stadtbäumen laut Vortrag ab?","options":["Unter anderem von Standort und Pflege.","Ausschließlich von der Zahl der Anwohner.","Nur von der Breite der Wege."],"answer":"Unter anderem von Standort und Pflege.","evidence_sentence_index":2},{"type":"对错","q":"Rückmeldungen aus der Nachbarschaft ersetzen laut Sprecher C die fachliche Prüfung.","options":["对","错"],"answer":"错","evidence_sentence_index":8}]},{"id":"schreiben","kind":"writing","title":"Schreiben · Zwei Aufgaben","duration_minutes":75,"official_duration_minutes":75,"source_note":"75 Minuten gelten für das gesamte Schreiben-Modul mit Teil 1 und Teil 2 zusammen.","tasks":[{"id":"forum","title":"Schreiben · Forumbeitrag","task":"In einem Onlineforum wird diskutiert, ob öffentliche Einrichtungen ihre Räume auch abends für selbstorganisierte Lerngruppen öffnen sollten. Schreiben Sie einen Beitrag.","points":["Stellen Sie Ihre Position klar dar.","Nennen Sie zwei nachvollziehbare Gründe.","Gehen Sie auf einen möglichen Einwand ein.","Schließen Sie mit einer konkreten Empfehlung."],"structure":["Thema knapp einführen und Position nennen","Argumente erläutern und mit Beispiel verdeutlichen","Einwand fair darstellen und abwägen","Empfehlung oder Schlussfolgerung formulieren"]},{"id":"email","title":"Schreiben · Formelle Nachricht","task":"Sie haben sich für einen berufsbegleitenden Sprachkurs angemeldet. Der angekündigte Unterrichtstermin wurde geändert und überschneidet sich nun mit einer festen Verpflichtung. Schreiben Sie der Kursleitung eine formelle Nachricht.","points":["Beziehen Sie sich auf Ihre Anmeldung und die Terminänderung.","Erklären Sie knapp, warum der neue Termin schwierig ist.","Fragen Sie nach einer geeigneten Alternative.","Bitten Sie um Rückmeldung bis zu einem selbst gewählten Datum."],"structure":["Betreff und höfliche Anrede","Anlass und konkrete Auswirkung nennen","Sachliche Bitte oder zwei Lösungsmöglichkeiten formulieren","Dank, Frist und passende Grußformel"]}]},{"id":"sprechen","kind":"speaking","title":"Sprechen · Themenkarten","duration_minutes":20,"official_duration_minutes":20,"source_note":"Partnerprüfung: etwa 20 Minuten; Einzelprüfung: etwa 15 Minuten. Diese Übung ist als Partnerprüfung gedacht.","cards":[{"topic":"Sollten Innenstädte weitgehend autofrei werden?","pro":"Weniger Verkehr kann öffentliche Räume für andere Nutzungen öffnen.","contra":"Eine Einschränkung kann Menschen mit langen oder schlecht angebundenen Wegen belasten."},{"topic":"Sollte hybrides Arbeiten in vielen Berufen der Normalfall sein?","pro":"Ortsflexibilität kann konzentriertes Arbeiten und private Verpflichtungen besser verbinden.","contra":"Weniger gemeinsame Präsenz kann Abstimmung und Zugehörigkeit erschweren."},{"topic":"Sollen öffentliche Bibliotheken stärker als Lern- und Begegnungsorte dienen?","pro":"Ein gemeinsamer, zugänglicher Raum kann Lernen unabhängig von der Wohnsituation unterstützen.","contra":"Zusätzliche Aufgaben brauchen Personal, klare Prioritäten und passende Räume."},{"topic":"Sollten Behörden ihre Dienstleistungen zuerst digital entwickeln?","pro":"Digitale Verfahren können Wege vermeiden und Abläufe nachvollziehbar machen.","contra":"Ohne erreichbare Alternativen können Menschen mit unterschiedlichen Voraussetzungen ausgeschlossen werden."},{"topic":"Sollten Unternehmen eine kürzere Standardarbeitswoche erproben?","pro":"Ein klar begrenzter Zeitrahmen kann dazu anregen, Aufgaben und Besprechungen besser zu priorisieren.","contra":"Nicht jede Tätigkeit lässt sich gleich organisieren; Mehrarbeit könnte auf andere Beschäftigte verlagert werden."}]}]}</script>
<script>
(()=>{
  'use strict';
  const EXAM=JSON.parse(document.getElementById('exam-data').textContent);
  const KEY='deutschSprint.p7.v1';
  let store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
  let attempts=store.attempts&&typeof store.attempts==='object'?store.attempts:{};
  let legacyDraftMigrated=false;
  const writing=EXAM.sections.find(item=>item.kind==='writing');
  if(writing){
    const existing=attempts[writing.id]&&typeof attempts[writing.id]==='object'?attempts[writing.id]:{};
    existing.responses=existing.responses&&typeof existing.responses==='object'?existing.responses:{};
    const legacyIds=['schreiben-forum','schreiben-email'];
    legacyIds.forEach((id,index)=>{
      const legacy=attempts[id];
      const task=writing.tasks[index];
      if(store.schemaVersion!==2&&legacy&&typeof legacy.response==='string'&&!Object.hasOwn(existing.responses,task.id)){
        existing.responses[task.id]=legacy.response;
        legacyDraftMigrated=true;
      }
    });
    if(legacyDraftMigrated)existing.legacyDraftMigrated=true;
    if(!Array.isArray(existing.taskDurations))existing.taskDurations=[35,40];
    attempts[writing.id]=existing;
  }
  let currentId=store.currentId||EXAM.sections[0].id;
  if(currentId==='schreiben-forum'||currentId==='schreiben-email')currentId=writing?.id||EXAM.sections[0].id;
  if(!EXAM.sections.some(item=>item.id===currentId))currentId=EXAM.sections[0].id;
  let timer=null;
  const app=document.getElementById('app');
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const section=()=>EXAM.sections.find(item=>item.id===currentId)||EXAM.sections[0];
  const attempt=()=>attempts[currentId]||{};
  function persist(){try{localStorage.setItem(KEY,JSON.stringify({schemaVersion:2,currentId,attempts}))}catch{toast('本地存储失败。')}}
  function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
  function sentences(text){return text.split(/\n+/).flatMap(paragraph=>paragraph.trim().split(/(?<=[.!?。！？])\s+(?=[„A-ZÄÖÜ])/).map(sentence=>sentence.trim()).filter(Boolean))}
  function started(value){return Boolean(value.startedAt&&!value.submittedAt)}
  function writingTask(value,exam){return exam.tasks?.[Math.min(Math.max(0,value.activeTaskIndex||0),exam.tasks.length-1)]}
  function remaining(value,exam){
    const deadline=exam.kind==='writing'&&value.customTiming?value.taskTimers?.[value.activeTaskIndex]?.expiresAt:value.expiresAt;
    return Math.max(0,Math.ceil(((deadline||Date.now())-Date.now())/1000));
  }
  function timeText(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
  function wordCount(text){return (text.trim().match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu)||[]).length}
  function modeStatus(value){if(value.submittedAt)return '<span class="status-pill done">已提交</span>';if(value.startedAt)return '<span class="status-pill running">限时进行中</span>';return '<span class="status-pill">尚未开始</span>'}
  function timerHtml(value,exam){
    const custom=exam.kind==='writing'&&value.customTiming;
    const seconds=value.startedAt?remaining(value,exam):custom?(value.taskDurations||[35,40]).reduce((sum,minutes)=>sum+(Number(minutes)||0),0)*60:exam.duration_minutes*60;
    const label=value.startedAt&&!value.submittedAt?(custom?`任务 ${Math.min((value.activeTaskIndex||0)+1,exam.tasks.length)}/${exam.tasks.length} · 剩余时间`:'剩余时间'):`${custom?'自定义分段':`练习 ${exam.duration_minutes} 分钟`}${exam.official_duration_minutes?` · 已核实（以报考页为准）：官方参考 ${exam.official_duration_minutes} 分钟`:''}`;
    const action=!value.startedAt?'<button class="btn primary" data-action="start">开始限时练习</button>':!value.submittedAt?`${custom&&value.activeTaskIndex<exam.tasks.length-1?'<button class="btn" data-action="next-writing-task">提前结束本题并开始下一题</button>':''}<button class="btn primary" data-action="submit">提交并结束</button>`:'<button class="btn danger" data-action="reset">重置本次练习</button>';
    return `<div class="timer-box"><span class="timer" id="timer" aria-live="off">${value.submittedAt?'已结束':timeText(seconds)}</span><span class="timer-label">${label} · ${modeStatus(value)}</span><div class="timer-actions">${action}</div></div>`;
  }
  function objectiveQuestions(exam,value){
    const answers=value.answers||{},locked=Boolean(value.submittedAt)||!started(value);
    return `<section class="panel"><h3>作答</h3><div class="questions">${exam.questions.map((question,index)=>{
      const answer=answers[index];let feedback='';
      if(value.submittedAt){const correct=answer===question.answer;const evidence=sentences(exam.text||exam.transcript)[question.evidence_sentence_index]||'';feedback=`<div class="feedback ${correct?'ok':'no'}"><strong>${correct?'正确':'未答对'}</strong> · 参考答案：${esc(question.answer)}<p>证据句：${esc(evidence)}</p></div>`}
      return `<fieldset class="question" style="border-left:0;border-right:0;border-bottom:0;margin:0;padding-left:0;padding-right:0" ${locked?'disabled':''}><legend><span class="qtype">${esc(question.type)} · ${index+1}</span>${esc(question.q)}</legend>${question.options.map(option=>`<label class="option"><input type="radio" name="q-${index}" value="${esc(option)}" data-answer="${index}" ${answer===option?'checked':''} ${locked?'disabled':''}><span>${esc(option)}</span></label>`).join('')}${feedback}</fieldset>`;
    }).join('')}</div>${!value.submittedAt?`<button class="btn primary" data-action="submit" ${started(value)?'':'disabled'}>提交并自动计分</button>${!started(value)?'<p class="help" style="margin-top:8px">开始计时后即可作答。</p>':''}`:`<div class="result-summary"><strong>${value.score}/${exam.questions.length}</strong> · ${Math.round(value.score/exam.questions.length*100)}% 正确</div>`}</section>`;
  }
  function durationNotice(exam){
    return `<div class="notice">这是缩小版练习，不是整套模考，不用于判断考试水平。${exam.official_duration_minutes?`官方整模块时长参考：${exam.official_duration_minutes} 分钟（已核实，报考前请核对考点信息）。`:''} ${esc(exam.source_note||EXAM.source_note||'')}</div>`;
  }
  function readingView(exam,value){return `${durationNotice(exam)}<section class="panel"><div class="task-prompt">${esc(exam.title)} · AI 生成 · 仅作练习</div><article class="reading-text" lang="de" style="margin-top:14px">${exam.text.split(/\n+/).map(paragraph=>`<p>${esc(paragraph)}</p>`).join('')}</article></section>${objectiveQuestions(exam,value)}`}
  function listeningView(exam,value){
    const active=started(value);
    const solo=/^Sprecher C:/m.test(exam.transcript);
    return `${durationNotice(exam)}<section class="panel"><h3>听力材料</h3><p class="help">${solo?'虚构的单人讲座式片段。':'虚构的双人对话/访谈练习。'}播放声音由设备的系统语音合成，不是真实录音；语音可用性随设备变化，部分语音可能依赖在线服务。</p>${active?`<button class="btn" data-action="speak-script">播放听力稿（系统语音）</button> <span class="tiny" id="speech-status" role="status"></span>`:'<div class="notice">开始后可播放听力稿。若设备没有德语语音，可请他人朗读或使用自己有权使用的音频材料。</div>'}${value.submittedAt?`<details style="margin-top:13px"><summary>查看听力稿与逐段证据</summary><article class="script-text" lang="de">${exam.transcript.split(/\n+/).map(paragraph=>`<p>${esc(paragraph)}</p>`).join('')}</article></details>`:''}</section>${objectiveQuestions(exam,value)}`;
  }
  function writingView(exam,value){
    const tasks=exam.tasks,activeIndex=Math.min(value.activeTaskIndex||0,tasks.length-1),task=tasks[activeIndex],responses=value.responses||{},response=responses[task.id]||'';
    const taskNav=tasks.map((item,index)=>`<button class="btn ${index===activeIndex?'primary':''}" data-writing-task-index="${index}" ${value.customTiming&&value.startedAt&&!value.submittedAt?'disabled':''}>任务 ${index+1}：${esc(item.title.replace(/^Schreiben · /,''))}</button>`).join(' ');
    const setup=!value.startedAt?`<div class="notice"><label><input type="checkbox" data-writing-custom ${value.customTiming?'checked':''}> 使用每项单独计时的练习模式</label>${value.customTiming?`<div class="field-row">${tasks.map((item,index)=>`<label>${esc(item.title.replace(/^Schreiben · /,''))}：<input type="number" min="1" max="120" step="1" data-writing-duration="${index}" value="${value.taskDurations?.[index]||[35,40][index]}"> 分钟</label>`).join('')}</div><span>自定义任务时长只用于个人练习，计时依次进行。</span>`:`<span>默认两项共用一个 75 分钟倒计时。</span>`}</div>`:'';
    const migrated=value.legacyDraftMigrated?'<div class="notice" style="margin-top:10px">已从旧版两个独立写作模块迁入原有作文草稿；旧计时不合并，新练习从开始时计时。</div>':'';
    const points=task.points||[],structure=task.structure||[];
    return `<section class="panel"><h3>写作练习 · ${value.customTiming?'分项计时':'共享 75 分钟'}</h3>${setup}${migrated}<div class="timer-actions" style="margin:12px 0">${taskNav}</div>${!started(value)&&!value.submittedAt?'':`<div class="task-prompt">${esc(task.task)}</div><h3 style="margin-top:17px">必须覆盖的要点</h3><ul class="list">${points.map(point=>`<li>${esc(point)}</li>`).join('')}</ul><label for="writing-response" class="tiny">你的作文 · ${task.title}</label><textarea class="text-entry" id="writing-response" data-writing-response="${esc(task.id)}" placeholder="在计时开始后写作…" ${started(value)&&!value.submittedAt?'':'disabled'}>${esc(response)}</textarea><div class="field-row"><span id="word-count">${wordCount(response)} 词</span><span>写作质量请交由 P4 批改；本页不生成语言分数。</span></div>${value.submittedAt?`<div class="result-summary">已提交 · ${value.taskWordCounts?.reduce((sum,count)=>sum+count,0)||0} 词。以下结构仅供自查，不是范文。</div><div class="reveal"><h4>参考结构</h4><ol>${structure.map(item=>`<li>${esc(item)}</li>`).join('')}</ol><h4>自查：是否覆盖任务要点</h4><div class="reflection">${points.map((point,index)=>`<label><input type="checkbox" data-selfcheck="${index}" ${value.selfchecks?.[task.id]?.[index]?'checked':''}><span>${esc(point)}</span></label>`).join('')}</div></div>`:''}`}</section>`;
  }
  function speakingView(exam,value){
    const chosen=Number.isInteger(value.cardIndex)?value.cardIndex:0,card=exam.cards[chosen];
    return `<section class="panel"><div class="notice">本练习按配对口试组织；官方参考约 20 分钟。话题卡仅用于组织观点练习，不代表官方题目。${esc(exam.source_note||'')}</div><div class="field-row"><div><h3>选择一张话题卡</h3><p class="help">准备立场与理由，再做 2–3 分钟独白和反方讨论。</p></div><select class="card-select" id="card-select" ${value.submittedAt?'disabled':''}>${exam.cards.map((item,index)=>`<option value="${index}" ${index===chosen?'selected':''}>话题 ${index+1} / ${exam.cards.length}</option>`).join('')}</select></div><div class="task-prompt" lang="de">${esc(card.topic)}</div><div class="angles" style="margin-top:12px"><div class="angle"><strong>角度 A</strong><span lang="de">${esc(card.pro)}</span></div><div class="angle"><strong>角度 B</strong><span lang="de">${esc(card.contra)}</span></div></div><label for="speaking-notes" class="tiny" style="display:block;margin-top:16px">关键词笔记（练习时可以留空）</label><textarea class="text-entry" id="speaking-notes" style="min-height:115px" placeholder="支持观点、让步、反驳、总结…" ${started(value)&&!value.submittedAt?'':'disabled'}>${esc(value.notes||'')}</textarea>${value.submittedAt?`<div class="result-summary">本次计时完成 · 关键词 ${wordCount(value.notes||'')} 词。口语质量请用 P3 或真人导师复盘。</div><div class="reflection"><label><input type="checkbox" data-selfcheck="0" ${value.selfcheck?.[0]?'checked':''}><span>我给出了清楚立场与至少两个理由。</span></label><label><input type="checkbox" data-selfcheck="1" ${value.selfcheck?.[1]?'checked':''}><span>我回应了相反角度并做出总结。</span></label></div>`:''}</section>`;
  }
  function practiceDuration(exam){return `${exam.duration_minutes} 分钟练习${exam.official_duration_minutes?` · 官网参考 ${exam.official_duration_minutes} 分钟`:''}`}
  function render(){
    const exam=section(),value=attempt();
    document.title=`${exam.title} · P7 缩小版练习`;
    const nav=EXAM.sections.map((item,index)=>`<button class="nav-item" data-task="${esc(item.id)}" aria-current="${item.id===exam.id?'page':'false'}"><span class="nav-num">${String(index+1).padStart(2,'0')}</span><span class="nav-title">${esc(item.title)}<span class="nav-sub">${esc(practiceDuration(item))} · ${item.kind==='reading'?'阅读':item.kind==='listening'?'听力':item.kind==='writing'?'写作':'口语'}</span></span></button>`).join('');
    const body=exam.kind==='reading'?readingView(exam,value):exam.kind==='listening'?listeningView(exam,value):exam.kind==='writing'?writingView(exam,value):speakingView(exam,value);
    app.innerHTML=`<header class="top"><div class="brand"><span class="mark">DS</span><span><strong>Deutsch Sprint</strong><small>C1 supplementary practice</small></span></div><div class="top-actions"><button class="btn" data-action="export">导出练习记录</button></div></header><p class="eyebrow">P7 · ORIGINAL PRACTICE · C1</p><h1>补充练习 · 缩小版</h1><p class="lede">这是缩小版练习，不是整套模考，不用于判断考试水平。阅读与听力自动计分；考试时长为 Goethe-Institut 实施规则参考值，报考前请核对考点信息。</p><div class="layout"><nav class="nav" aria-label="练习模块">${nav}<div class="side-note">计时从开始后持续运行，刷新页面也会继续；到时自动提交或推进下一项。模块只保存在本机浏览器。</div></nav><main class="main"><section class="task-head"><div><span class="status-pill">${exam.kind==='reading'?'Lesen':exam.kind==='listening'?'Hören':exam.kind==='writing'?'Schreiben':'Sprechen'}</span><h2 style="margin-top:9px">${esc(exam.title)}</h2><p>${esc(EXAM.label)}</p></div>${timerHtml(value,exam)}</section>${body}<p class="foot">AI 生成 · 仅作练习 · 不代表官方考试题、评分标准或通过结论</p></main></div>`;
    startTicker();
  }
  function startTicker(){if(timer)clearInterval(timer);timer=setInterval(tick,1000);tick()}
  function beginCustomTask(value,exam,index,now=Date.now()){
    value.activeTaskIndex=index;
    value.taskTimers=value.taskTimers||[];
    const minutes=Math.max(1,Math.min(120,Number(value.taskDurations?.[index])||[35,40][index]||35));
    value.taskTimers[index]={startedAt:now,expiresAt:now+minutes*60000};
  }
  function tick(){
    const exam=section(),value=attempt(),timerEl=document.getElementById('timer');
    if(!timerEl)return;
    if(value.startedAt&&!value.submittedAt){
      const left=remaining(value,exam);timerEl.textContent=timeText(left);
      if(left<=0){
        if(exam.kind==='writing'&&value.customTiming&&value.activeTaskIndex<exam.tasks.length-1){
          const oldIndex=value.activeTaskIndex,deadline=value.taskTimers[oldIndex].expiresAt;value.taskTimers[oldIndex].submittedAt=deadline;beginCustomTask(value,exam,oldIndex+1,deadline);persist();render();toast(`任务 ${oldIndex+1} 计时结束，已开始下一项。`);return;
        }
        finish(true);return;
      }
    }
  }
  function finish(timedOut=false){
    const exam=section(),value=attempts[currentId];if(!value||!value.startedAt||value.submittedAt)return;
    if('speechSynthesis'in window)speechSynthesis.cancel();
    value.submittedAt=Date.now();value.timedOut=timedOut;
    if(exam.kind==='reading'||exam.kind==='listening')value.score=exam.questions.reduce((sum,question,index)=>sum+((value.answers?.[index]||'')===question.answer?1:0),0);
    else if(exam.kind==='writing')value.taskWordCounts=exam.tasks.map(task=>wordCount(value.responses?.[task.id]||''));
    persist();render();toast(timedOut?'时间到，已提交本模块。':'已提交。');
  }
  function start(){
    const exam=section(),value=attempts[currentId]||{};
    if(value.submittedAt){toast('本次已提交，请先重置后再开始。');return}
    if(!value.startedAt){
      const now=Date.now();value.startedAt=now;
      if(exam.kind==='writing'&&value.customTiming){value.activeTaskIndex=0;value.taskTimers=[];beginCustomTask(value,exam,0,now)}
      else value.expiresAt=now+exam.duration_minutes*60000;
    }
    if(exam.kind==='speaking'&&!Number.isInteger(value.cardIndex))value.cardIndex=0;
    attempts[currentId]=value;persist();render();toast(exam.kind==='writing'&&value.customTiming?'任务一计时已开始；之后会依次倒计时。':'计时已开始，不可暂停。');
  }
  function nextWritingTask(){
    const exam=section(),value=attempts[currentId];
    if(exam.kind!=='writing'||!value?.customTiming||!started(value)||value.activeTaskIndex>=exam.tasks.length-1)return;
    value.taskTimers[value.activeTaskIndex].submittedAt=Date.now();beginCustomTask(value,exam,value.activeTaskIndex+1);persist();render();toast('已开始下一项自定义计时。');
  }
  function reset(){if(!confirm('重置会清除本模块当前作答记录。继续？'))return;delete attempts[currentId];persist();render();toast('本模块已重置。')}
  function exportProgress(){const data={schemaVersion:2,exportedAt:new Date().toISOString(),attempts};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`deutsch-sprint-p7-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('练习记录已导出。')}
  function speakScript(){
    const exam=section();if(!('speechSynthesis'in window)){toast('此浏览器没有系统语音合成。');return}
    speechSynthesis.cancel();
    const turns=[...exam.transcript.matchAll(/^(?:Sprecherin A|Sprecher B|Sprecher C):\s*(.+)$/gm)].map(match=>({speaker:match[0].startsWith('Sprecherin A:')?'A':match[0].startsWith('Sprecher B:')?'B':'C',text:match[1]}));
    if(!turns.length){toast('没有找到听力脚本。');return}
    const german=speechSynthesis.getVoices().filter(voice=>voice.lang.toLowerCase().startsWith('de'));
    const hasTwoSpeakers=turns.some(turn=>turn.speaker==='A')&&turns.some(turn=>turn.speaker==='B');
    const distinct=hasTwoSpeakers&&german.length>1&&german[0].voiceURI!==german[1].voiceURI;
    const voiceA=german[0]||null,voiceB=distinct?german[1]:voiceA;
    const status=document.getElementById('speech-status');
    if(status)status.textContent=distinct?'检测到两种德语系统语音，将分别用于说话人 A/B。':hasTwoSpeakers?'没有两种可区分的德语系统语音，本次使用单一语音；系统语音不是真实录音。':'本片段为单人讲座式朗读；系统语音不是真实录音。';
    turns.forEach(turn=>{
      const utterance=new SpeechSynthesisUtterance(turn.text);utterance.lang='de-DE';
      utterance.voice=turn.speaker==='A'?voiceA:turn.speaker==='B'?voiceB:voiceA;
      utterance.onerror=()=>{if(status)status.textContent='系统语音播放失败；可请他人朗读。'};
      speechSynthesis.speak(utterance);
    });
  }
  document.addEventListener('click',event=>{
    const nav=event.target.closest('[data-task]');
    if(nav){currentId=nav.dataset.task;persist();render();return}
    const action=event.target.closest('[data-action]')?.dataset.action;
    if(action==='start')start();if(action==='submit')finish(false);if(action==='reset')reset();if(action==='export')exportProgress();if(action==='speak-script')speakScript();if(action==='next-writing-task')nextWritingTask();
    const taskButton=event.target.closest('[data-writing-task-index]');
    if(taskButton){const value=attempts[currentId]||{};if(!(value.customTiming&&value.startedAt&&!value.submittedAt)){value.activeTaskIndex=Number(taskButton.dataset.writingTaskIndex);attempts[currentId]=value;persist();render()}}
  });
  document.addEventListener('change',event=>{
    const answer=event.target.closest('[data-answer]');
    if(answer){const value=attempts[currentId]||{answers:{}};if(!value.submittedAt){value.answers=value.answers||{};value.answers[answer.dataset.answer]=answer.value;attempts[currentId]=value;persist()}return}
    if(event.target.matches('[data-writing-custom]')){const value=attempts[currentId]||{};if(!value.startedAt&&!value.submittedAt){value.customTiming=event.target.checked;value.taskDurations=value.taskDurations||[35,40];attempts[currentId]=value;persist();render()}return}
    if(event.target.matches('[data-writing-duration]')){const value=attempts[currentId]||{};const index=Number(event.target.dataset.writingDuration);value.taskDurations=value.taskDurations||[35,40];value.taskDurations[index]=Math.max(1,Math.min(120,Math.round(Number(event.target.value)||1)));event.target.value=value.taskDurations[index];attempts[currentId]=value;persist();document.getElementById('timer').textContent=timeText(value.taskDurations.reduce((sum,minutes)=>sum+minutes,0)*60);return}
    if(event.target.id==='card-select'){const value=attempts[currentId]||{};if(!value.submittedAt){value.cardIndex=Number(event.target.value);attempts[currentId]=value;persist();render()}return}
    const selfcheck=event.target.closest('[data-selfcheck]');
    if(selfcheck){const value=attempts[currentId];if(!value)return;if(section().kind==='writing'){const task=writingTask(value,section());value.selfchecks=value.selfchecks||{};value.selfchecks[task.id]=value.selfchecks[task.id]||[];value.selfchecks[task.id][Number(selfcheck.dataset.selfcheck)]=selfcheck.checked}else{value.selfcheck=value.selfcheck||[];value.selfcheck[Number(selfcheck.dataset.selfcheck)]=selfcheck.checked}persist()}
  });
  document.addEventListener('input',event=>{
    if(event.target.matches('[data-writing-response]')){const value=attempts[currentId]||{responses:{}};if(started(value)&&!value.submittedAt){value.responses=value.responses||{};value.responses[event.target.dataset.writingResponse]=event.target.value;attempts[currentId]=value;persist()}const count=document.getElementById('word-count');if(count)count.textContent=`${wordCount(event.target.value)} 词`}
    if(event.target.id==='speaking-notes'){const value=attempts[currentId]||{};if(started(value)&&!value.submittedAt){value.notes=event.target.value;attempts[currentId]=value;persist()}}
  });
  window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)speechSynthesis.cancel()});
  if(legacyDraftMigrated)persist();
  render();
})();
</script></body></html>
