<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Deutsch Sprint · 学习仪表盘</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f4ef;
      --surface: #fffefa;
      --surface-2: #f0efe9;
      --ink: #1e2925;
      --muted: #6b7771;
      --line: #dfe2db;
      --accent: #285e4d;
      --accent-strong: #174635;
      --accent-soft: #e4eee8;
      --gold: #b9773d;
      --gold-soft: #f6eadc;
      --red: #ad5145;
      --red-soft: #f7e8e4;
      --blue: #597493;
      --blue-soft: #e8edf3;
      --shadow: 0 10px 32px rgba(36, 47, 41, .055);
      --radius: 17px;
      --focus: #ac6b2f;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --canvas: #171d1a;
      --surface: #202823;
      --surface-2: #29322c;
      --ink: #edf2ed;
      --muted: #a6b1a9;
      --line: #3a473f;
      --accent: #8bc0a6;
      --accent-strong: #a8d4bb;
      --accent-soft: #293d33;
      --gold: #e3ad78;
      --gold-soft: #453528;
      --red: #e0988a;
      --red-soft: #442e2a;
      --blue: #a6bad2;
      --blue-soft: #2c3744;
      --shadow: 0 10px 32px rgba(0, 0, 0, .18);
      --focus: #e3ad78;
    }
    [data-theme="dark"] .hero-panel { background: #284b3a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-size: 15px; line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .skip-link { position: absolute; left: 12px; top: -60px; z-index: 30; padding: 10px 14px; background: var(--surface); border-radius: 8px; }
    .skip-link:focus { top: 12px; }
    .app { max-width: 1460px; min-height: 100vh; margin: 0 auto; padding: 0 34px 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 78px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; color: #fff; background: var(--accent-strong); font-size: 14px; font-weight: 750; letter-spacing: -.06em; }
    [data-theme="dark"] .brand-mark { color: #17211b; }
    .brand-copy { display: grid; line-height: 1.2; }
    .brand-copy strong { font-size: 14px; letter-spacing: .025em; }
    .brand-copy span { margin-top: 4px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button, .quiet-button, .primary-button, .danger-button { min-height: 42px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); cursor: pointer; transition: background .16s ease, border-color .16s ease, transform .16s ease; }
    .icon-button { width: 42px; display: grid; place-items: center; }
    .icon-button svg { width: 18px; height: 18px; }
    .quiet-button { padding: 0 14px; color: var(--ink); }
    .primary-button { padding: 0 17px; color: #fff; border-color: var(--accent-strong); background: var(--accent-strong); font-weight: 650; }
    [data-theme="dark"] .primary-button { color: #17211b; }
    .danger-button { padding: 0 14px; color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); background: var(--surface); }
    .icon-button:hover, .quiet-button:hover, .danger-button:hover { background: var(--surface-2); }
    .primary-button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 34px 0 23px; }
    .eyebrow { margin: 0 0 9px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 3vw, 39px); font-weight: 500; letter-spacing: -.035em; line-height: 1.1; }
    .masthead p { margin: 0; color: var(--muted); }
    .phase-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; font-size: 12px; }
    .phase-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
    .layout { display: grid; grid-template-columns: 204px minmax(0, 1fr); gap: 26px; align-items: start; }
    .sidebar { position: sticky; top: 18px; display: grid; gap: 24px; padding-top: 5px; }
    .nav-list { display: grid; gap: 5px; }
    .nav-button { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 45px; padding: 0 12px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; text-align: left; cursor: pointer; }
    .nav-button:hover { color: var(--ink); background: var(--surface-2); }
    .nav-button[aria-current="page"] { color: var(--accent-strong); background: var(--accent-soft); font-weight: 700; }
    .nav-button svg { flex: 0 0 auto; width: 17px; height: 17px; }
    .privacy-note { padding: 14px; border: 1px solid var(--line); border-radius: 13px; color: var(--muted); font-size: 12px; }
    .privacy-note strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 12px; }
    main { min-width: 0; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin: 4px 0 18px; }
    .page-heading h2 { margin-bottom: 5px; font-family: Georgia, "Times New Roman", serif; font-size: 27px; font-weight: 500; letter-spacing: -.025em; }
    .page-heading p { margin: 0; color: var(--muted); font-size: 13px; }
    .section-kicker { margin: 0 0 13px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .panel { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .panel + .panel { margin-top: 16px; }
    .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .panel-heading h3 { margin: 0; font-size: 15px; font-weight: 720; letter-spacing: -.01em; }
    .panel-heading p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: 16px; }
    .hero-panel { position: relative; overflow: hidden; padding: 24px; color: #f5f8f4; border: 0; background: var(--accent-strong); box-shadow: var(--shadow); }
    .hero-panel:after { content: ""; position: absolute; right: -68px; top: -114px; width: 260px; height: 260px; border: 1px solid rgba(255,255,255,.16); border-radius: 50%; box-shadow: 0 0 0 25px rgba(255,255,255,.035), 0 0 0 55px rgba(255,255,255,.025); pointer-events: none; }
    .hero-panel .eyebrow { color: #c5dccf; }
    .hero-panel h2 { position: relative; z-index: 1; max-width: 560px; margin-bottom: 9px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(25px, 2.5vw, 32px); font-weight: 500; line-height: 1.15; }
    .hero-panel p { position: relative; z-index: 1; max-width: 560px; margin-bottom: 20px; color: #d6e4dc; font-size: 13px; }
    .hero-bottom { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; color: #edf4ef; font-size: 12px; }
    .hero-bottom strong { font-size: 13px; }
    .stat-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { min-height: 92px; padding: 15px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .stat-label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 11px; }
    .stat-value { font-size: 23px; font-weight: 700; letter-spacing: -.045em; }
    .stat-unit { margin-left: 4px; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0; }
    .main-two-col { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr); gap: 16px; margin-top: 16px; }
    .block-list { display: grid; gap: 0; }
    .block-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 83px 46px; align-items: center; gap: 11px; min-height: 54px; border-top: 1px solid var(--line); }
    .block-row:first-child { border-top: 0; }
    .block-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-strong); cursor: pointer; }
    .syllabus-panel { margin-bottom: 16px; }
    .syllabus-panel .eyebrow { margin: 0 0 4px; }
    .syllabus-panel h4 { margin: 19px 0 8px; font-size: 13px; }
    .syllabus-meta { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; margin: 12px 0; }
    .syllabus-meta p { margin: 0; padding: 11px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 12px; }
    .syllabus-meta strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 11px; }
    .syllabus-tasks { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .syllabus-task { display: flex; align-items: flex-start; gap: 11px; min-height: 58px; padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
    .syllabus-task:last-child { grid-column: 1/-1; }
    .syllabus-task input { flex: 0 0 20px; width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent-strong); }
    .syllabus-task > span { display: grid; gap: 3px; min-width: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .syllabus-task strong { color: var(--ink); font-size: 12px; }
    .syllabus-task.is-done { border-color: var(--accent); background: var(--accent-soft); }
    .block-name { font-weight: 650; font-size: 13px; }
    .block-meta { color: var(--muted); font-size: 11px; }
    .minutes-input, .field input, .field select, .field textarea, .inline-number { width: 100%; min-height: 40px; padding: 8px 10px; color: var(--ink); border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .minutes-input { min-height: 36px; padding: 5px 8px; text-align: right; }
    .minutes-label { color: var(--muted); font-size: 11px; }
    input[type="number"] { font-variant-numeric: tabular-nums; }
    .note-field { margin-top: 14px; }
    .note-field textarea { min-height: 64px; resize: vertical; }
    .progress-wrap { display: grid; gap: 16px; }
    .progress-item { display: grid; gap: 8px; }
    .progress-label { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
    .progress-label span:last-child { color: var(--muted); }
    .progress-track { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--accent); }
    .gate-list { display: grid; gap: 10px; }
    .gate-row { display: flex; align-items: flex-start; gap: 11px; padding: 12px 0; border-top: 1px solid var(--line); }
    .gate-row:first-child { border-top: 0; padding-top: 0; }
    .gate-symbol { width: 25px; height: 25px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 8px; color: var(--gold); background: var(--gold-soft); font-size: 11px; font-weight: 750; }
    .gate-row.is-done .gate-symbol { color: var(--accent-strong); background: var(--accent-soft); }
    .gate-row strong { display: block; margin-bottom: 3px; font-size: 12px; }
    .gate-row span { color: var(--muted); font-size: 11px; }
    .chart-wrap { width: 100%; min-height: 225px; }
    .chart-wrap svg { width: 100%; height: auto; overflow: visible; }
    .chart-empty { display: grid; min-height: 190px; place-items: center; padding: 20px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; font-size: 13px; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
    .field { min-width: 0; display: grid; gap: 6px; }
    .field label, .field > span { color: var(--muted); font-size: 11px; font-weight: 650; }
    .field textarea { min-height: 78px; resize: vertical; }
    .field-wide { grid-column: 1 / -1; }
    .scores-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 13px 0; }
    .scores-grid .field input { text-align: right; }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 14px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 11px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    td strong { font-size: 12px; }
    .table-action { min-height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--surface); cursor: pointer; font-size: 11px; white-space: nowrap; }
    .table-action:hover { color: var(--ink); background: var(--surface-2); }
    .table-action.delete:hover { color: var(--red); border-color: var(--red); }
    .score-chip { display: inline-block; min-width: 36px; padding: 3px 6px; border-radius: 7px; background: var(--surface-2); text-align: center; font-variant-numeric: tabular-nums; }
    .tag { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 99px; color: var(--blue); background: var(--blue-soft); font-size: 10px; font-weight: 700; }
    .tag.good { color: var(--accent-strong); background: var(--accent-soft); }
    .tag.warn { color: var(--gold); background: var(--gold-soft); }
    .tag.alert { color: var(--red); background: var(--red-soft); }
    .error-type-bars { display: grid; gap: 11px; }
    .error-bar-row { display: grid; grid-template-columns: 110px minmax(0,1fr) 25px; align-items: center; gap: 9px; font-size: 11px; }
    .error-bar-row span:first-child { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .bar-track i { display: block; height: 100%; border-radius: inherit; background: var(--gold); }
    .error-bar-row b { text-align: right; font-size: 11px; }
    .review-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
    .review-stat { padding: 15px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); }
    .review-stat span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
    .review-stat strong { font-size: 22px; letter-spacing: -.04em; }
    .rule-list { display: grid; gap: 9px; }
    .rule-item { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 11px 12px; border-radius: 11px; background: var(--surface-2); font-size: 12px; }
    .rule-item .rule-icon { color: var(--muted); font-weight: 800; }
    .rule-item.triggered { background: var(--gold-soft); }
    .rule-item.triggered .rule-icon { color: var(--gold); }
    .rule-item strong { display: block; margin-bottom: 3px; }
    .rule-item p { margin: 0; color: var(--muted); }
    .gate-editor { display: grid; gap: 12px; }
    .gate-card { padding: 16px; border: 1px solid var(--line); border-radius: 13px; }
    .gate-card h3 { margin: 0 0 4px; font-size: 14px; }
    .gate-card h4 { margin: 0 0 10px; font-size: 13px; }
    .gate-card > p { margin: 0 0 12px; color: var(--muted); font-size: 11px; }
    .gate-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .gate-field-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-top: 11px; }
    .backup-reminder { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--muted); font-size: 12px; }
    .backup-reminder.is-stale { color: var(--ink); border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); background: var(--gold-soft); }
    .rule-item.pending { background: var(--surface-2); }
    .rule-item.pending .rule-icon { color: var(--muted); }
    .rule-item.not-triggered .rule-icon { color: var(--accent); }
    .gate-check { display: flex; align-items: flex-start; gap: 8px; min-height: 40px; padding: 8px; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; cursor: pointer; }
    .gate-check input { margin: 2px 0 0; accent-color: var(--accent-strong); }
    .empty-row { padding: 26px 12px; color: var(--muted); text-align: center; }
    .settings-grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: 16px; }
    .settings-copy { color: var(--muted); font-size: 12px; }
    .settings-copy li { margin: 8px 0; }
    .settings-copy ul { padding-left: 18px; }
    .callout { padding: 13px 14px; border-left: 3px solid var(--gold); border-radius: 0 9px 9px 0; background: var(--gold-soft); color: var(--ink); font-size: 12px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 50; padding: 11px 15px; border-radius: 10px; color: #fff; background: #263b31; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(8px); transition: opacity .18s ease, transform .18s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    dialog { width: min(560px, calc(100% - 28px)); padding: 0; border: 1px solid var(--line); border-radius: 18px; color: var(--ink); background: var(--surface); box-shadow: 0 24px 80px rgba(0,0,0,.25); }
    dialog::backdrop { background: rgba(16, 24, 19, .45); backdrop-filter: blur(3px); }
    .dialog-inner { padding: 23px; }
    .dialog-head { display: flex; justify-content: space-between; align-items: start; gap: 15px; margin-bottom: 17px; }
    .dialog-head h2 { margin: 0 0 4px; font-family: Georgia, "Times New Roman", serif; font-size: 23px; font-weight: 500; }
    .dialog-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .dialog-close { width: 38px; min-height: 38px; }
    .small-muted { color: var(--muted); font-size: 11px; }
    .footer-note { margin-top: 19px; color: var(--muted); text-align: center; font-size: 11px; }
    .hidden { display: none !important; }
    @media (max-width: 1040px) {
      .app { padding: 0 22px 42px; }
      .layout { grid-template-columns: 170px minmax(0,1fr); gap: 19px; }
      .overview-grid, .main-two-col { grid-template-columns: minmax(0,1fr); }
      .gate-metrics, .gate-field-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 720px) {
      .app { padding: 0 15px 35px; }
      .topbar { min-height: 67px; }
      .top-actions .quiet-button { display: none; }
      .masthead { align-items: flex-start; flex-direction: column; padding: 27px 0 17px; gap: 13px; }
      .layout { grid-template-columns: 1fr; gap: 14px; }
      .sidebar { position: static; z-index: 5; margin: 0 -15px; padding: 0 15px 7px; background: var(--canvas); }
      .nav-list { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: thin; }
      .nav-button { flex: 0 0 auto; width: auto; min-height: 42px; padding: 0 12px; font-size: 12px; }
      .nav-button svg { width: 15px; height: 15px; }
      .privacy-note { display: none; }
      .page-heading h2 { font-size: 24px; }
      .panel { padding: 16px; border-radius: 14px; }
      .hero-panel { padding: 21px; }
      .stat-strip { gap: 7px; }
      .stat { min-height: 82px; padding: 12px 10px; }
      .stat-label { font-size: 10px; }
      .stat-value { font-size: 20px; }
      .form-grid, .settings-grid { grid-template-columns: 1fr; }
      .scores-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .review-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .block-row { grid-template-columns: 20px minmax(0,1fr) 68px 40px; gap: 7px; }
      .syllabus-meta { grid-template-columns: 1fr; }
      .syllabus-tasks { grid-template-columns: 1fr; }
      .syllabus-task:last-child { grid-column: auto; }
      .block-name { font-size: 12px; }
      .block-meta { font-size: 10px; }
      .minutes-input { font-size: 12px; }
      .error-bar-row { grid-template-columns: 92px minmax(0,1fr) 22px; }
      .page-heading > .quiet-button, .page-heading > .primary-button { flex: 0 0 auto; }
      .gate-metrics, .gate-field-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 410px) {
      .brand-copy span { display: none; }
      .top-actions { gap: 5px; }
      .icon-button { width: 39px; min-height: 39px; }
      .phase-pill { font-size: 11px; }
      .stat-strip { grid-template-columns: 1fr 1fr; }
      .stat-strip .stat:last-child { grid-column: 1 / -1; }
      .gate-metrics, .gate-field-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>

  <script>
  (() => {
    'use strict';
    const CONFIG = JSON.parse(document.getElementById('app-config').textContent);
    const SYLLABUS = JSON.parse(document.getElementById('syllabus-data').textContent).weeks;
    const STORAGE_KEY = 'deutschSprint.dashboard.v1';
    const SKILLS = [
      {id:'reading', label:'阅读 Lesen', color:'#ba7543'},
      {id:'listening', label:'听力 Hören', color:'#607e9c'},
      {id:'writing', label:'写作 Schreiben', color:'#718c53'},
      {id:'speaking', label:'口语 Sprechen', color:'#9a6d91'}
    ];
    const EVAL_LEVELS = ['未评估','B2 不稳','B2 稳定','接近 C1','C1'];
    const EVAL_RANK = {'未评估':0,'B2 不稳':1,'B2 稳定':2,'接近 C1':3,'C1':4};
    const VIEW_LABELS = {overview:'总览', exams:'模考记录', errors:'错误日志', review:'周复盘', settings:'设置'};
    let currentView = 'overview';
    let selectedReviewWeek = null;
    let toastTimer;
    let needsInitialSetup = false;

    const today = () => localDateKey(new Date());
    function localDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function parseDate(value) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ''));
      if (!match) return null;
      const [, ys, ms, ds] = match;
      const y=Number(ys), m=Number(ms), d=Number(ds);
      const out = new Date(y, m - 1, d, 12);
      if (out.getFullYear()!==y || out.getMonth()!==m-1 || out.getDate()!==d) return null;
      return out;
    }
    function addDays(date, count) { const d = new Date(date); d.setDate(d.getDate() + count); return d; }
    function firstMondayOnOrAfter(value) {
      const date = parseDate(value);
      if (!date) return '';
      return localDateKey(addDays(date, (8-date.getDay())%7));
    }
    function newW1Start(startDate) {
      return firstMondayOnOrAfter(localDateKey(addDays(parseDate(startDate), 2)));
    }
    function dateDiffDays(a, b) { return Math.floor((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()) - Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())) / 86400000); }
    function fmtDate(value, options={month:'short',day:'numeric'}) {
      const date = parseDate(value);
      if (!date) return '—';
      return new Intl.DateTimeFormat('zh-CN', options).format(date);
    }
    function emptyAssessment() { return {level:'未评估', evaluator:'', date:''}; }
    function emptyGateData() {
      return {
        w4: {reading:null, listening:null, writing:emptyAssessment(), speaking:emptyAssessment(), retention:null},
        w9: {reading:null, listening:null, writing:emptyAssessment(), speaking:emptyAssessment()},
        w13: {
          mock1:{title:'',date:'',mode:'full',reading:null,listening:null,writing:emptyAssessment(),speaking:emptyAssessment()},
          mock2:{title:'',date:'',mode:'full',reading:null,listening:null,writing:emptyAssessment(),speaking:emptyAssessment()},
          siteConfirmed:false
        }
      };
    }
    function normalizedAssessment(value) {
      const level=EVAL_LEVELS.includes(value?.level)?value.level:'未评估';
      const evaluator=['导师','AI','自评'].includes(value?.evaluator)?value.evaluator:'';
      const date=parseDate(value?.date)?value.date:'';
      return {level,evaluator,date};
    }
    function normalizeGateData(value) {
      const base=emptyGateData();
      if(!value||typeof value!=='object'||Array.isArray(value)||Array.isArray(value.w4))return base;
      const percent=(v)=>nullableNumber(v,0,100);
      ['w4','w9'].forEach(id=>{
        const source=value[id]&&typeof value[id]==='object'?value[id]:{};
        base[id]={reading:percent(source.reading),listening:percent(source.listening),writing:normalizedAssessment(source.writing),speaking:normalizedAssessment(source.speaking)};
        if(id==='w4')base[id].retention=percent(source.retention);
      });
      const w13=value.w13&&typeof value.w13==='object'?value.w13:{};
      ['mock1','mock2'].forEach(key=>{
        const source=w13[key]&&typeof w13[key]==='object'?w13[key]:{};
        base.w13[key]={title:String(source.title||'').slice(0,100),date:parseDate(source.date)?source.date:'',mode:source.mode==='single'?'single':'full',reading:percent(source.reading),listening:percent(source.listening),writing:normalizedAssessment(source.writing),speaking:normalizedAssessment(source.speaking)};
      });
      base.w13.siteConfirmed=Boolean(w13.siteConfirmed);
      return base;
    }
    function defaultState() {
      return {
        schemaVersion: 3,
        settings: {startDate: '', w1Start: '', theme: 'system'},
        checkins: {},
        gates:emptyGateData(),
        mocks: [],
        errors: [],
        lastExportAt:null
      };
    }
    function normalizeState(value) {
      const base = defaultState();
      if (!value || typeof value !== 'object') return base;
      const next = {
        schemaVersion:3,
        settings:{...base.settings, ...(value.settings || {})},
        checkins:value.checkins && typeof value.checkins === 'object' ? value.checkins : {},
        gates:normalizeGateData(value.gates),
        mocks:Array.isArray(value.mocks) ? value.mocks : [],
        errors:Array.isArray(value.errors) ? value.errors : [],
        lastExportAt:typeof (value.lastExportAt||value.exportedAt)==='string' && Number.isFinite(Date.parse(value.lastExportAt||value.exportedAt)) ? (value.lastExportAt||value.exportedAt) : null
      };
      const oldVersion=Number(value.schemaVersion)||1;
      if (!parseDate(next.settings.startDate)) next.settings.startDate = '';

        id:String(m?.id || `mock-${i+1}`),
        date:String(m?.date || ''),
        title:String(m?.title || '').slice(0,100),
        mode:m?.mode==='single'?'single':'full',

    function loadState() {

        if (imported?.schemaVersion!==3) {
          try { localStorage.setItem(STORAGE_KEY,JSON.stringify(normalized)); }
          catch (error) { console.warn('无法立即升级本地进度格式；本次仍按兼容格式读取',error); }

        return normalized;

    function nullableNumber(value, min=0, max=100) {

    function currentSprintWeek(date=today()) {
      const start = parseDate(state.settings.startDate);
      const w1 = parseDate(state.settings.w1Start);
      const selected = parseDate(date);
      if (!start || !w1 || !selected) return {week:0, diagnosticDay:1, phase:'诊断周'};
      const days = dateDiffDays(selected, start);
      if (days < 0) return {week:0, diagnosticDay:0, phase:'尚未开始'};
      if (selected < w1) return {week:0, diagnosticDay:days+1, phase:'诊断与装机'};
      const week = Math.floor(dateDiffDays(selected,w1) / 7) + 1;

    function weekSummary(start, end) {

        const passed=g.reading>=75&&g.listening>=75&&g.retention>=85&&assessmentMeets(g.writing,'B2 稳定')&&assessmentMeets(g.speaking,'B2 稳定');
        return {status:passed?'已达标':'未达标',count:passed?5:0,total:5};
      }
      if (gateId==='w9') {
        const values=[g.reading,g.listening];
        if (!values.every(hasScore)||!assessmentReady(g.writing)||!assessmentReady(g.speaking)) return {status:'待评估',count:values.filter(hasScore).length+Number(assessmentReady(g.writing))+Number(assessmentReady(g.speaking)),total:4};
        const passed=g.reading>=60&&g.listening>=60&&assessmentMeets(g.writing,'接近 C1')&&assessmentMeets(g.speaking,'接近 C1');

      const complete=completed.length===2&&g.siteConfirmed;
      const anyMissing=mocks.some(m=>!m.title||!parseDate(m.date)||!hasScore(m.reading)||!hasScore(m.listening)||!assessmentReady(m.writing)||!assessmentReady(m.speaking))||!g.siteConfirmed;

          <section class="panel" aria-labelledby="mock-chart-title"><div class="panel-heading"><div><h3 id="mock-chart-title">模考趋势</h3><p>只展示你录入的单项百分比，不自动折算官方分数。</p></div><button class="table-action" data-view="exams">查看模考</button></div>${renderScoreChart(230)}<div class="legend">${SKILLS.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div></section>
        </div>`;
    }
    function renderBlockList(checkin) {
      return `<div class="block-list">${CONFIG.dailyBlocks.map(b=>{
        const item=checkin.blocks[b.id] || {done:false,minutes:0};
        return `<div class="block-row"><input type="checkbox" data-block-done="${b.id}" aria-label="完成${esc(b.label)}" ${item.done?'checked':''}><div><div class="block-name">${esc(b.label)}</div><div class="block-meta">${b.time} · 计划 ${b.minutes} 分钟</div></div><input class="minutes-input" type="number" min="0" max="600" step="5" inputmode="numeric" data-block-minutes="${b.id}" value="${item.minutes}" aria-label="${esc(b.label)}实际分钟数"><span class="minutes-label">分钟</span></div>`;
      }).join('')}</div>`;
    }
    function renderSyllabusPanel(week,phase,checkin,date) {
      const blocks=CONFIG.dailyBlocks;
      const done=blocks.filter(block=>checkin.dailyTasks?.[block.id]).length;
      return `<section class="panel syllabus-panel" aria-labelledby="syllabus-title"><div class="panel-heading"><div><p class="eyebrow">WEEKLY SYLLABUS</p><h3 id="syllabus-title">${phase.week===0?'W0 预备 · 先做本周计划':'W'+week.week+' 本周任务'} <span class="tag">${done}/5 今日完成</span></h3><p>${esc(week.stage)} 阶段 · ${esc(week.grammar_theme)}</p></div><a class="table-action" href="p1-reader/index.html?lesson=${encodeURIComponent(week.reading_lesson_id)}">打开本周精读课件 →</a></div><div class="syllabus-meta"><p><strong>口语话题</strong>${esc(week.speaking_topic)}</p><p><strong>写作任务</strong>${esc(week.writing_task_type)}</p><p><strong>周复盘</strong>${esc(week.review_points)}</p></div><h4>今日任务 · 五个学习块</h4><div class="syllabus-tasks">${blocks.map(block=>`<label class="syllabus-task ${checkin.dailyTasks?.[block.id]?'is-done':''}"><input type="checkbox" data-syllabus-task="${block.id}" aria-label="完成今日任务：${esc(block.label)}" ${checkin.dailyTasks?.[block.id]?'checked':''}><span><strong>${esc(block.label)}</strong><span>${esc(week.daily_tasks[block.id])}</span></span></label>`).join('')}</div></section>`;
    }
    function renderGateSummary() {
      return `<div class="gate-list">${CONFIG.gates.map(g=>{
        const result=gateResult(g.id),done=result.status==='已达标';
        return `<div class="gate-row ${done?'is-done':''}"><div class="gate-symbol">${done?'✓':g.id.replace('w','W')}</div><div><strong>${esc(g.label)} <span class="tag ${done?'good':result.status==='未达标'?'alert':'warn'}">${result.status}</span></strong><span>${result.count}/${result.total} 项可核验 · 内部门槛，非官方评分</span></div></div>`;
      }).join('')}</div>`;
    }
    function renderExams() {
      const sorted = [...state.mocks].sort((a,b)=>b.date.localeCompare(a.date));
      return `<div class="page-heading"><div><h2>模考记录</h2><p>按日期追踪四项变化；单项练习可以只填写一项。</p></div><button class="primary-button" data-action="add-mock">＋ 记录一次</button></div>
        <section class="panel"><div class="panel-heading"><div><h3>四项得分趋势</h3><p>分数按百分比录入；单项缺失时不连线。</p></div><span class="tag">${state.mocks.length} 次记录</span></div>${renderScoreChart(300)}<div class="legend">${SKILLS.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}</div></section>
        <section class="panel"><div class="panel-heading"><div><h3>历史记录</h3><p>可记录官方 Modelltest 或原创补充练习。</p></div></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>套题 / 模块</th><th>阅读</th><th>听力</th><th>写作</th><th>口语</th><th>操作</th></tr></thead><tbody>${sorted.length?sorted.map(m=>`<tr><td>${fmtDate(m.date,{year:'numeric',month:'short',day:'numeric'})}</td><td><strong>${esc(m.title)}</strong><br><span class="small-muted">${esc(m.mode==='full'?'完整模考':'单项练习')}</span></td>${SKILLS.map(s=>`<td>${Number.isFinite(m.scores?.[s.id])?`<span class="score-chip">${m.scores[s.id]}%</span>`:'—'}</td>`).join('')}<td><button class="table-action delete" data-delete-mock="${esc(m.id)}" aria-label="删除${esc(m.title)}">删除</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty-row">还没有模考记录。录入第一次后，这里会显示各项趋势。</td></tr>`}</tbody></table></div></section>`;
    }
    function renderScoreChart(height=250) {
      const records = [...state.mocks].filter(m=>SKILLS.some(s=>Number.isFinite(m.scores?.[s.id]))).sort((a,b)=>a.date.localeCompare(b.date)).slice(-10);
      if (!records.length) return `<div class="chart-empty">完成一次模考后，阅读、听力、写作和口语的成绩会分别显示在这里。<br><span class="small-muted">图表不会填入演示数据。</span></div>`;
      const width=720, pad={l:38,r:16,t:14,b:35}, plotW=width-pad.l-pad.r, plotH=height-pad.t-pad.b;
      const x=i=>pad.l+(records.length===1?plotW/2:i*plotW/(records.length-1));
      const y=v=>pad.t+(100-v)*plotH/100;
      const grid=[0,25,50,75,100].map(v=>`<g><line x1="${pad.l}" y1="${y(v)}" x2="${width-pad.r}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${pad.l-9}" y="${y(v)+4}" text-anchor="end" fill="var(--muted)" font-size="10">${v}</text></g>`).join('');
      const lines=SKILLS.map(s=>{
        let segments=[], cur=[];
        records.forEach((m,i)=>{const val=m.scores?.[s.id]; if(Number.isFinite(val)) cur.push(`${x(i)},${y(val)}`); else if(cur.length){segments.push(cur.join(' '));cur=[];}});
        if(cur.length)segments.push(cur.join(' '));
        const paths=segments.map(seg=>`<polyline points="${seg}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
        const points=records.map((m,i)=>{const v=m.scores?.[s.id];return Number.isFinite(v)?`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(s.label)} · ${fmtDate(m.date)} · ${v}%</title></circle>`:''}).join('');
        return paths+points;
      }).join('');
      const labels=records.map((m,i)=>`<text x="${x(i)}" y="${height-8}" text-anchor="middle" fill="var(--muted)" font-size="10">${esc(fmtDate(m.date,{month:'numeric',day:'numeric'}))}</text>`).join('');
      return `<div class="chart-wrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="最近 ${records.length} 次模考的四项百分比趋势图，纵轴为 0 到 100">${grid}${lines}${labels}</svg></div>`;
    }
    function renderErrors() {
      const sorted=[...state.errors].sort((a,b)=>b.date.localeCompare(a.date));
      const counts={}; state.errors.forEach(e=>counts[e.type]=(counts[e.type]||0)+1);
      const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const max=top[0]?.[1]||1;
      return `<div class="page-heading"><div><h2>错误日志</h2><p>记录原句、修正和规则；每周挑高频错误转成产出卡。</p></div><button class="primary-button" data-action="add-error">＋ 记一条错误</button></div>
        <div class="main-two-col" style="margin-top:0"><section class="panel"><div class="panel-heading"><div><h3>高频错误 Top 5</h3><p>按日志条数统计，不代表错误严重度。</p></div></div>${top.length?`<div class="error-type-bars">${top.map(([type,count])=>`<div class="error-bar-row"><span>${esc(type)}</span><div class="bar-track"><i style="width:${Math.max(5,Math.round(count/max*100))}%"></i></div><b>${count}</b></div>`).join('')}</div>`:`<div class="chart-empty" style="min-height:130px">记录错误后，会自动统计出现次数最多的五类。</div>`}</section>
        <section class="panel"><div class="panel-heading"><div><h3>近六周记录节奏</h3><p>按错误发生日期统计每周条数。</p></div></div>${renderErrorTrend()}</section></div>
        <section class="panel"><div class="panel-heading"><div><h3>全部错误</h3><p>单条可复制为 P2 错误卡 JSON。</p></div><span class="tag">${state.errors.length} 条</span></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>类型</th><th>我的原句</th><th>修正</th><th>规则</th><th>操作</th></tr></thead><tbody>${sorted.length?sorted.map(e=>`<tr><td>${fmtDate(e.date,{month:'short',day:'numeric'})}</td><td><span class="tag warn">${esc(e.type)}</span></td><td>${esc(e.original)}</td><td>${esc(e.correction)}</td><td>${esc(e.rule)}</td><td><button class="table-action" data-copy-error="${esc(e.id)}">复制卡片</button> <button class="table-action delete" data-delete-error="${esc(e.id)}" aria-label="删除错误记录">删除</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty-row">还没有记录。每次写作或口语订正后，挑最值得复用的一条记下来。</td></tr>`}</tbody></table></div></section>`;
    }
    function renderErrorTrend() {
      const current=weekRange();
      const first=Math.max(0,current.week-5);
      const weeks=[];
      for(let week=first;week<=current.week;week++){
        const start=weekStartForNumber(week);
        const end=week===0?addDays(parseDate(state.settings.w1Start),-1):addDays(start,6);
        const a=localDateKey(start), b=localDateKey(end);
        const count=state.errors.filter(e=>e.date>=a&&e.date<=b).length;
        weeks.push({week,a,count});
      }
      const max=Math.max(1,...weeks.map(w=>w.count));
      return `<div style="display:grid;grid-template-columns:repeat(${weeks.length},minmax(0,1fr));align-items:end;gap:9px;height:130px;padding-top:10px">${weeks.map(w=>`<div style="display:grid;justify-items:center;gap:7px;height:100%;grid-template-rows:1fr auto"><div style="align-self:end;width:min(100%,34px);height:${Math.max(5,w.count/max*82)}px;border-radius:6px 6px 2px 2px;background:var(--accent-soft);position:relative" title="${fmtDate(w.a)}：${w.count} 条"><i style="display:block;width:100%;height:${w.count?100:0}%;border-radius:inherit;background:var(--accent)"></i></div><span class="small-muted">W${w.week}</span></div>`).join('')}</div>`;
    }
    function ruleState(eligible, ready, triggered) {
      if (!eligible || !ready) return '待观察';
      return triggered ? '已触发' : '未触发';
    }
    function renderRule(rule) {
      const cls=rule.status==='已触发'?'triggered':rule.status==='未触发'?'not-triggered':'pending';
      const icon=rule.status==='已触发'?'!':rule.status==='未触发'?'✓':'·';
      const tagClass=rule.status==='已触发'?'warn':rule.status==='未触发'?'good':'';
      return `<div class="rule-item ${cls}"><span class="rule-icon">${icon}</span><div><strong>${esc(rule.title)} <span class="tag ${tagClass}">${rule.status}</span></strong><p>${esc(rule.detail)}</p></div></div>`;
    }
    function renderReview() {
      const latest=weekRange();
      const chosen=selectedReviewWeek===null?latest.week:Math.max(0,Math.min(latest.week,selectedReviewWeek));
      const anchor=localDateKey(weekStartForNumber(chosen));
      const range=weekRange(anchor);
      const weekOptions=`<option value="" ${selectedReviewWeek===null?'selected':''}>当前周 · W${latest.week}</option>`+Array.from({length:latest.week},(_,i)=>latest.week-1-i).map(week=>`<option value="${week}" ${selectedReviewWeek===week?'selected':''}>W${week}${week===0?' · 诊断期':''}</option>`).join('');
      const current=weekSummary(range.start,range.end);
      const prevEnd=localDateKey(addDays(parseDate(range.start),-1));
      const prevStart=weekRange(prevEnd).start;
      const previous=weekSummary(prevStart,prevEnd);
      const twoBackStart=localDateKey(addDays(parseDate(prevStart),-7));
      const twoBackEnd=localDateKey(addDays(parseDate(prevStart),-1));
      const twoBack=weekSummary(twoBackStart,twoBackEnd);
      const currentTypes=countErrors(range.start,range.end), prevTypes=countErrors(prevStart,prevEnd);
      const repeated=Object.keys(currentTypes).filter(t=>currentTypes[t]>=5&&prevTypes[t]>=5);
      const settled=today()>range.end;
      const eligible=range.week>0&&(settled||current.entries.length>=5);
      const rules=[];
      const retentionReady=current.retentions.length>0;
      const retentionLow=current.retention!==null&&current.retention<80;
      rules.push({status:ruleState(eligible,retentionReady,retentionLow),title:'Anki 保持率低于 80%',detail:!eligible?(range.week===0?'W0 诊断期不参与评估；本周记录满 5 天或周次结束后再看。':'本周尚未满 5 个记录日，等待本周结束或补足记录。'):!retentionReady?'尚无保持率数据，待观察。':retentionLow?`本周平均 ${current.retention.toFixed(1)}%；下周新卡减半，先消化复习量。`:`本周平均 ${current.retention.toFixed(1)}%，未触发。`});
      const retentionPairReady=range.week>=2&&retentionReady&&previous.retentions.length>0;
      const retentionHigh=current.retention!==null&&previous.retention!==null&&current.retention>92&&previous.retention>92;
      rules.push({status:ruleState(eligible,retentionPairReady,retentionHigh),title:'保持率连续两周高于 92%',detail:!eligible?'待本周达到评估条件。':!retentionPairReady?'当前周或上周缺少保持率数据，待观察。':retentionHigh?`本周 ${current.retention.toFixed(1)}%，上周 ${previous.retention.toFixed(1)}%；可以小幅增加新卡。`:`当前周 ${current.retention.toFixed(1)}%，上周 ${previous.retention.toFixed(1)}%，未触发。`});
      const errorDataReady=range.week>=2&&current.entries.length>0&&previous.entries.length>0;
      rules.push({status:ruleState(eligible,errorDataReady,repeated.length>0),title:'同类错误连续两周各出现 ≥5 次',detail:!eligible?'待本周达到评估条件。':!errorDataReady?'当前周或上周缺少学习记录，待观察。':repeated.length?`${repeated.join('、')}：安排 3 天专项（讲解 + 输出 + 产出卡）。`:'两周日志中没有同类错误各达 5 次的情况，未触发。'});
      const hoursLow=current.minutes<1800;
      const hoursReady=current.entries.length>0;
      rules.push({status:ruleState(eligible,hoursReady,hoursLow),title:'本周主动学习少于 30 小时',detail:!eligible?(range.week===0?'W0 诊断期不参与评估。':'本周记录满 5 天或周次结束后再评估。'):!hoursReady?'本周没有打卡数据，待观察。':hoursLow?`当前记录 ${formatHours(current.minutes)} 小时；先查疲劳、难度或拖延原因，降低难度，不加时长。`:`当前记录 ${formatHours(current.minutes)} 小时，未触发。`});
      const scoresProgress=[current.mockAverage,previous.mockAverage,twoBack.mockAverage];
      const progressReady=range.week>=3&&scoresProgress.every(Number.isFinite);
      const noProgress=progressReady&&scoresProgress[0]<=scoresProgress[1]&&scoresProgress[1]<=scoresProgress[2];
      rules.push({status:ruleState(eligible,progressReady,noProgress),title:'模考连续两周无进步',detail:!eligible?'待本周达到评估条件。':!progressReady?'近三周缺少可比较的模考分数，待观察。':noProgress?'连续三周周均分未上升；回到“输入 → 模仿 → 输出”，并检查材料或导师是否合适。':'近三周均分未呈连续停滞，未触发。'});
      return `<div class="page-heading"><div><h2>周复盘 · W${range.week}</h2><p>${fmtDate(range.start,{month:'long',day:'numeric'})} – ${fmtDate(range.end,{month:'long',day:'numeric'})} · 起始日起算 · 周日复盘并导出 JSON</p></div><div><label for="review-week">查看周次 </label><select id="review-week">${weekOptions}</select><span class="phase-pill">${current.entries.length} 天有记录</span></div></div>
        ${backupReminder()}
        <section class="panel"><div class="panel-heading"><div><h3>本周数据</h3><p>根据每日打卡、模考和错误日志自动汇总。</p></div><button class="quiet-button" data-action="export">导出备份</button></div><div class="review-grid">
          <div class="review-stat"><span>主动学习</span><strong>${formatHours(current.minutes)}</strong><span>小时 / 目标 30 小时</span></div>
          <div class="review-stat"><span>口语练习</span><strong>${current.speaking}</strong><span>分钟</span></div>
          <div class="review-stat"><span>新增词块</span><strong>${current.newChunks}</strong><span>个</span></div>
          <div class="review-stat"><span>Anki 保持率</span><strong>${current.retention===null?'—':`${current.retention.toFixed(1)}%`}</strong><span>${current.retentions.length} 天有数据</span></div>
          <div class="review-stat"><span>模考 / 单项</span><strong>${current.mockCount}</strong><span>${current.mockAverage===null?'暂无分数':`录入单项均值 ${current.mockAverage.toFixed(1)}%`}</span></div>
          <div class="review-stat"><span>错误记录</span><strong>${state.errors.filter(e=>e.date>=range.start&&e.date<=range.end).length}</strong><span>条 · Top 类别 ${Object.keys(currentTypes).sort((a,b)=>currentTypes[b]-currentTypes[a]).slice(0,2).join('、')||'—'}</span></div>
        </div></section>
        <section class="panel"><div class="panel-heading"><div><h3>本周调整提示</h3><p>规则状态：待观察 / 未触发 / 已触发。W0 不参与评估；其余周在结束或记录满 5 天后评估。</p></div></div><div class="rule-list">${rules.map(renderRule).join('')}</div></section>
        <section class="panel"><div class="panel-heading"><div><h3>关卡证据</h3><p>以下是个人训练的内部门槛，不是 Goethe 官方评分或证书判断。</p></div></div>${renderGateEditor()}</section>`;
    }
    function countErrors(start,end) { const out={}; state.errors.filter(e=>e.date>=start&&e.date<=end).forEach(e=>out[e.type]=(out[e.type]||0)+1); return out; }
    function gateField(label,path,value,type='number',attrs='') {
      const id=`gate-${path.replaceAll('.','-')}`;
      if(type==='level')return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}" data-gate-field="${path}">${EVAL_LEVELS.map(level=>`<option ${value===level?'selected':''}>${esc(level)}</option>`).join('')}</select></div>`;
      if(type==='evaluator')return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}" data-gate-field="${path}"><option value="">请选择</option>${['导师','AI','自评'].map(x=>`<option ${value===x?'selected':''}>${x}</option>`).join('')}</select></div>`;
      return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" data-gate-field="${path}" type="${type}" ${attrs} value="${esc(value??'')}"></div>`;
    }
    function assessmentEditor(label,path,value) {
      return `<div class="field-wide"><p class="section-kicker">${esc(label)}</p><div class="gate-field-grid">${gateField('评价等级',`${path}.level`,value.level,'level')}${gateField('评价者',`${path}.evaluator`,value.evaluator,'evaluator')}${gateField('评价日期',`${path}.date`,value.date,'date')}</div></div>`;
    }
    function renderGateEditor() {
      const w4=state.gates.w4,w9=state.gates.w9,w13=state.gates.w13;
      const score=(label,path,value)=>gateField(label,path,value,'number','min="0" max="100" step="0.1" inputmode="decimal" placeholder="%"');
      const mock=(key,label,m)=>`<div class="gate-card"><h4>${label}</h4><div class="gate-field-grid">${gateField('完整模考名称',`w13.${key}.title`,m.title,'text','maxlength="100"')}${gateField('日期',`w13.${key}.date`,m.date,'date')}${score('阅读 Lesen（%）',`w13.${key}.reading`,m.reading)}${score('听力 Hören（%）',`w13.${key}.listening`,m.listening)}${assessmentEditor('写作评估',`w13.${key}.writing`,m.writing)}${assessmentEditor('口语评估',`w13.${key}.speaking`,m.speaking)}</div></div>`;
      return `<div class="gate-editor">
        <div class="gate-card"><h3>W4 内部门槛 <span class="small-muted">${gateResult('w4').status}</span></h3><p>阅读/听力百分比、写作/口语稳定等级、Anki 保持率；写作口语需记录评价者和日期。</p><div class="gate-field-grid">${score('B2 阅读（%）','w4.reading',w4.reading)}${score('B2 听力（%）','w4.listening',w4.listening)}${score('Anki 保持率（%）','w4.retention',w4.retention)}${assessmentEditor('写作评估','w4.writing',w4.writing)}${assessmentEditor('口语评估','w4.speaking',w4.speaking)}</div></div>
        <div class="gate-card"><h3>W9 内部门槛 <span class="small-muted">${gateResult('w9').status}</span></h3><p>C1 阅读/听力 ≥60%；写作/口语 ≥接近 C1。</p><div class="gate-field-grid">${score('C1 阅读（%）','w9.reading',w9.reading)}${score('C1 听力（%）','w9.listening',w9.listening)}${assessmentEditor('写作评估','w9.writing',w9.writing)}${assessmentEditor('口语评估','w9.speaking',w9.speaking)}</div></div>
        <div class="gate-card"><h3>W13 报考判断 <span class="small-muted">${gateResult('w13').status}</span></h3><p>记录连续两套完整模考；每套阅读/听力 ≥70%、写作/口语 ≥接近 C1。另行确认考点与用途方认可证书。</p>${mock('mock1','完整模考一',w13.mock1)}${mock('mock2','完整模考二',w13.mock2)}<label class="gate-check"><input type="checkbox" data-gate-field="w13.siteConfirmed" ${w13.siteConfirmed?'checked':''}><span>已确认考点与用途方认可证书（内部门槛）</span></label></div>
      </div>`;
    }
    function renderSettings() {
      return `<div class="page-heading"><div><h2>设置与备份</h2><p>设置起跑日期、管理本机主题，并控制数据备份。</p></div></div>
        <div class="settings-grid"><section class="panel"><div class="panel-heading"><div><h3>冲刺设置</h3><p>W0 从起始日开始；W1 与后续周按周一至周日计算。</p></div></div><form id="settings-form"><div class="field"><label for="start-date">计划起始日</label><input id="start-date" name="startDate" type="date" value="${esc(state.settings.startDate)}" required><span class="small-muted">W1 起始日：${fmtDate(state.settings.w1Start,{year:'numeric',month:'long',day:'numeric'})}（起始日后至少 2 天，并对齐周一）。旧记录会保留原 W1 日期。</span></div><div class="field" style="margin-top:14px"><label for="theme-select">外观</label><select id="theme-select" name="theme"><option value="system" ${state.settings.theme==='system'?'selected':''}>跟随系统</option><option value="light" ${state.settings.theme==='light'?'selected':''}>浅色</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>深色</option></select></div><div class="form-actions"><button class="primary-button" type="submit">保存设置</button></div></form></section>
          <section class="panel"><div class="panel-heading"><div><h3>备份与隐私</h3><p>无账号、无联网同步；浏览器清理可能会删除本地记录。</p></div></div><div class="settings-copy"><ul><li>所有数据保存在此设备浏览器的 localStorage 中。</li><li>导出会生成可读的 JSON 文件，可用于换设备或恢复数据。</li><li>导入会替换当前全部记录；请先导出当前数据。</li><li>分数按你填写的百分比保留，不自动解释为 Goethe 官方成绩。</li></ul>${backupReminder()}</div><div class="form-actions" style="justify-content:flex-start"><button class="primary-button" data-action="export">导出 JSON 备份</button><button class="quiet-button" data-action="import">导入 JSON</button></div></section></div>
        <section class="panel"><div class="panel-heading"><div><h3>学习块</h3><p>按原计划配置的每日学习块；实际时间在今日打卡页调整。</p></div></div>${renderBlockList(getCheckin(today()))}<p class="small-muted" style="margin:12px 0 0">每日主动学习目标约 6.5 小时；散步、做饭与晚间被动输入不计入主动时间。</p></section>
        <section class="panel"><div class="panel-heading"><div><h3>清除本地记录</h3><p>此操作不可撤销；如需保留，请先导出 JSON 备份。</p></div></div><button class="danger-button" data-action="clear-data">清除所有记录</button></section>`;
    }
    function renderAll() { renderShell(); }
    function ensureCheckin() {
      const date=today();
      if (!state.checkins[date]) state.checkins[date]=emptyCheckin();
      return state.checkins[date];
    }
    function updateBlock(id, key, value) {
      const entry=ensureCheckin();
      if (!entry.blocks[id]) entry.blocks[id]={done:false,minutes:0};
      entry.blocks[id][key]=value;
      if (key==='done' && value && !entry.blocks[id].minutes) entry.blocks[id].minutes=CONFIG.dailyBlocks.find(b=>b.id===id)?.minutes||0;
      if (key==='done' && !value && entry.blocks[id].minutes===(CONFIG.dailyBlocks.find(b=>b.id===id)?.minutes||0)) entry.blocks[id].minutes=0;
      persist(false); renderAll();
    }
    function exportData() {
      state.lastExportAt=new Date().toISOString();
      persist(false);
      const payload={...state, exportedAt:state.lastExportAt};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');
      link.href=url; link.download=`deutsch-sprint-${today()}.json`; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000); renderAll(); showToast('JSON 备份已导出');
    }
    function validateImported(data) {
      const issues=[];
      if (!data || typeof data!=='object' || Array.isArray(data)) return ['JSON 顶层必须是对象'];
      if (![1,2,3].includes(data.schemaVersion)) issues.push('schemaVersion 必须为 1、2 或 3');
      if (!data.settings || !parseDate(data.settings.startDate)) issues.push('缺少有效 settings.startDate');
      if (data.settings?.w1Start && !parseDate(data.settings.w1Start)) issues.push('settings.w1Start 日期无效');
      if (data.settings && !['system','light','dark'].includes(data.settings.theme)) issues.push('settings.theme 必须是 system、light 或 dark');
      if (!data.checkins || typeof data.checkins!=='object' || Array.isArray(data.checkins)) issues.push('checkins 必须是日期为键的对象');
      else Object.entries(data.checkins).forEach(([date,c])=>{
        if (!parseDate(date) || !c || typeof c!=='object') issues.push(`打卡日期无效：${date}`);
        else {
          if (!c.blocks || typeof c.blocks!=='object') issues.push(`${date} 缺少 blocks`);
          else CONFIG.dailyBlocks.forEach(b=>{const v=c.blocks[b.id];if(v && (!Number.isFinite(Number(v.minutes))||Number(v.minutes)<0||Number(v.minutes)>600||typeof v.done!=='boolean'))issues.push(`${date} 的 ${b.id} 记录无效`)});
          if (c.retention!==null && c.retention!==undefined && (!Number.isFinite(Number(c.retention))||Number(c.retention)<0||Number(c.retention)>100))issues.push(`${date} 的保持率必须为 0–100`);
        }
      });
      if (!Array.isArray(data.mocks)) issues.push('mocks 必须是数组');
      else data.mocks.forEach((m,i)=>{if(!m||!parseDate(m.date)||!String(m.title||'').trim())issues.push(`模考 ${i+1} 缺少有效日期或标题`);else SKILLS.forEach(s=>{const v=m.scores?.[s.id];if(v!==null&&v!==undefined&&v!==''&&(!Number.isFinite(Number(v))||Number(v)<0||Number(v)>100))issues.push(`模考 ${i+1} 的 ${s.label} 必须为 0–100`)});});
      if (!Array.isArray(data.errors)) issues.push('errors 必须是数组');
      else data.errors.forEach((e,i)=>{if(!e||!parseDate(e.date)||!String(e.type||'').trim()||!String(e.original||'').trim()||!String(e.correction||'').trim()||!String(e.rule||'').trim())issues.push(`错误记录 ${i+1} 缺少日期、类型、原句、修正或规则`)});
      if (data.schemaVersion>=2 && (!data.gates || typeof data.gates!=='object' || Array.isArray(data.gates))) issues.push('schemaVersion 2+ 的 gates 必须是对象');
      return issues;
    }
    function importData(file) {
      const reader=new FileReader();
      reader.onload=()=>{
        try {
          const value=JSON.parse(String(reader.result||''));
          const issues=validateImported(value);
          if (issues.length) { alert('无法导入：\n\n'+issues.slice(0,8).join('\n')+(issues.length>8?'\n…':'')); return; }
          if (!confirm('导入会替换此浏览器中的所有冲刺记录。建议先导出当前数据。继续导入？')) return;
          state=normalizeState(value); needsInitialSetup=false; const setupDialog=document.getElementById('start-date-dialog'); if(setupDialog.open)setupDialog.close(); selectedReviewWeek=null; persist(false); renderAll(); showToast(value.schemaVersion===1?'旧版数据已导入；旧关卡勾选已忽略':'备份已导入');
        } catch { alert('无法读取 JSON 文件，请确认文件内容完整。'); }
      };
      reader.readAsText(file);
    }
    function openMockDialog() {
      const d=document.getElementById('mock-dialog');
      d.innerHTML=`<div class="dialog-inner"><div class="dialog-head"><div><h2 id="mock-dialog-title">记录模考</h2><p>百分比 0–100；缺项可留空。</p></div><button class="icon-button dialog-close" data-close-dialog="mock-dialog" aria-label="关闭">${ICONS.close}</button></div><form id="mock-form"><div class="form-grid"><div class="field"><label for="mock-date">日期</label><input id="mock-date" name="date" type="date" value="${today()}" required></div><div class="field"><label for="mock-mode">类型</label><select id="mock-mode" name="mode"><option value="full">完整模考</option><option value="single">单项练习</option></select></div><div class="field field-wide"><label for="mock-title">套题 / 练习名称</label><input id="mock-title" name="title" maxlength="100" placeholder="例如 Goethe C1 Modelltest 1" required></div></div><div class="scores-grid">${SKILLS.map(s=>`<div class="field"><label for="score-${s.id}">${s.label}</label><input id="score-${s.id}" name="${s.id}" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="%"></div>`).join('')}</div><p class="small-muted">记录百分比用于训练追踪。官方分数和及格线请以对应考试版本说明为准。</p><div class="form-actions"><button class="quiet-button" type="button" data-close-dialog="mock-dialog">取消</button><button class="primary-button" type="submit">保存记录</button></div></form></div>`;
      d.showModal();
    }
    function openErrorDialog() {
      const d=document.getElementById('error-dialog');
      d.innerHTML=`<div class="dialog-inner"><div class="dialog-head"><div><h2 id="error-dialog-title">记一条错误</h2><p>写成下次能主动提取、重做的一条规则。</p></div><button class="icon-button dialog-close" data-close-dialog="error-dialog" aria-label="关闭">${ICONS.close}</button></div><form id="error-form"><div class="form-grid"><div class="field"><label for="error-date">日期</label><input id="error-date" name="date" type="date" value="${today()}" required></div><div class="field"><label for="error-type">错误类型</label><select id="error-type" name="type">${CONFIG.errorTypes.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field field-wide"><label for="error-original">我的原句</label><textarea id="error-original" name="original" maxlength="1000" required placeholder="保留原来的错误表达"></textarea></div><div class="field field-wide"><label for="error-correction">修正句</label><textarea id="error-correction" name="correction" maxlength="1000" required placeholder="写出自然、准确的德语"></textarea></div><div class="field field-wide"><label for="error-rule">一句话规则</label><textarea id="error-rule" name="rule" maxlength="500" required placeholder="例如：obwohl 引导的从句中，变位动词放在句末。"></textarea></div></div><div class="form-actions"><button class="quiet-button" type="button" data-close-dialog="error-dialog">取消</button><button class="primary-button" type="submit">保存错误</button></div></form></div>`;
      d.showModal();
    }
    function copyError(id) {
      const e=state.errors.find(x=>x.id===id); if(!e)return;
      const payload={type:'error',source:{date:e.date},front:e.original,back:{correct:e.correction,rule:e.rule}};
      const text=JSON.stringify(payload,null,2);
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>showToast('P2 错误卡 JSON 已复制')).catch(()=>fallbackCopy(text));
      else fallbackCopy(text);
    }
    function fallbackCopy(text) {
      const area=document.createElement('textarea'); area.value=text; area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();
      try{document.execCommand('copy');showToast('P2 错误卡 JSON 已复制');}catch{prompt('复制以下 P2 错误卡 JSON：',text);} area.remove();
    }
    document.addEventListener('click', event => {
      const view=event.target.closest('[data-view]');
      if (view) {event.preventDefault();currentView=view.dataset.view;renderAll();return;}
      const action=event.target.closest('[data-action]')?.dataset.action;
      if (action==='export') exportData();
      if (action==='import') document.getElementById('import-file').click();
      if (action==='theme') {state.settings.theme=effectiveTheme()==='dark'?'light':'dark';persist(false);renderAll();}
      if (action==='add-mock') openMockDialog();
      if (action==='add-error') openErrorDialog();
      if (action==='edit-gates') {currentView='review';renderAll();document.querySelector('.gate-editor')?.scrollIntoView({behavior:'smooth',block:'start'});}
      if (action==='clear-data') {
        if(confirm('确定删除当前浏览器里的全部记录吗？此操作不能撤销。')) {localStorage.removeItem(STORAGE_KEY);state=defaultState();persist(false);currentView='overview';renderAll();showToast('本地记录已清除');}
      }
      const close=event.target.closest('[data-close-dialog]')?.dataset.closeDialog;
      if(close) document.getElementById(close)?.close();
      const delMock=event.target.closest('[data-delete-mock]')?.dataset.deleteMock;
      if(delMock&&confirm('删除这条模考记录？')) {state.mocks=state.mocks.filter(m=>m.id!==delMock);persist(false);renderAll();showToast('模考记录已删除');}
      const delError=event.target.closest('[data-delete-error]')?.dataset.deleteError;
      if(delError&&confirm('删除这条错误记录？')) {state.errors=state.errors.filter(e=>e.id!==delError);persist(false);renderAll();showToast('错误记录已删除');}
      const copy=event.target.closest('[data-copy-error]')?.dataset.copyError;
      if(copy)copyError(copy);
    });
    document.addEventListener('change', event => {
      if(event.target.id==='review-week'){selectedReviewWeek=event.target.value===''?null:Number(event.target.value);renderAll();return;}
      const done=event.target.closest('[data-block-done]');
      if(done) {updateBlock(done.dataset.blockDone,'done',done.checked);return;}
      const syllabusTask=event.target.closest('[data-syllabus-task]');
      if(syllabusTask) {const item=ensureCheckin();item.dailyTasks=item.dailyTasks||{};item.dailyTasks[syllabusTask.dataset.syllabusTask]=syllabusTask.checked;persist(false);renderAll();showToast(syllabusTask.checked?'今日任务已完成':'已取消任务完成');return;}
      const minutes=event.target.closest('[data-block-minutes]');
      if(minutes) {updateBlock(minutes.dataset.blockMinutes,'minutes',clampInt(minutes.value,0,600,0));return;}
      const field=event.target.closest('[data-checkin-field]');
      if(field) {
        const key=field.dataset.checkinField, item=ensureCheckin();
        item[key]=key==='note'?field.value:key==='retention'?nullableNumber(field.value,0,100):clampInt(field.value,0,500,0);
        persist(false); renderAll(); showToast('今日记录已保存'); return;
      }
      const gate=event.target.closest('[data-gate-field]');
      if(gate) {
        const parts=gate.dataset.gateField.split('.');
        let target=state.gates; while(parts.length>1) target=target[parts.shift()];
        const key=parts[0], value=gate.type==='checkbox'?gate.checked:gate.type==='number'?nullableNumber(gate.value,0,100):gate.value;
        target[key]=value; persist(false); renderAll(); showToast('关卡证据已保存'); return;
      }
      if(event.target.id==='import-file'&&event.target.files?.[0]) {importData(event.target.files[0]);event.target.value='';}
    });
    document.addEventListener('submit', event => {
      if(event.target.id==='mock-form') {
        event.preventDefault(); const fd=new FormData(event.target);
        const scores={};SKILLS.forEach(s=>scores[s.id]=nullableNumber(fd.get(s.id),0,100));
        if(!SKILLS.some(s=>Number.isFinite(scores[s.id]))) {showToast('至少填写一项分数');return;}
        state.mocks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:String(fd.get('date')),title:String(fd.get('title')).trim(),mode:String(fd.get('mode')),scores});
        persist(false);document.getElementById('mock-dialog').close();renderAll();showToast('模考记录已保存');return;
      }
      if(event.target.id==='error-form') {
        event.preventDefault();const fd=new FormData(event.target);
        state.errors.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:String(fd.get('date')),type:String(fd.get('type')),original:String(fd.get('original')).trim(),correction:String(fd.get('correction')).trim(),rule:String(fd.get('rule')).trim()});
        persist(false);document.getElementById('error-dialog').close();renderAll();showToast('错误记录已保存');return;
      }
      if(event.target.id==='settings-form') {
        event.preventDefault();const fd=new FormData(event.target);const start=String(fd.get('startDate'));
        if(!parseDate(start)){showToast('请选择有效的起始日期');return;}
        state.settings.startDate=start;state.settings.w1Start=newW1Start(start);state.schemaVersion=3;selectedReviewWeek=null;state.settings.theme=String(fd.get('theme'));persist(false);renderAll();showToast('设置已保存');
        return;
      }
      if(event.target.id==='initial-start-form') {
        event.preventDefault();const fd=new FormData(event.target);const start=String(fd.get('startDate'));
        if(!parseDate(start)){showToast('请选择有效的起始日期');return;}
        state.settings.startDate=start;state.settings.w1Start=newW1Start(start);state.schemaVersion=3;needsInitialSetup=false;persist(false);document.getElementById('start-date-dialog').close();renderAll();showToast('起始日已保存，可以开始使用');
      }
    });
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.settings.theme==='system')renderAll();});
    renderAll();
    if(needsInitialSetup) {
      const setupDialog=document.getElementById('start-date-dialog');
      document.getElementById('initial-start-date').value=today();
      setupDialog.addEventListener('cancel',event=>event.preventDefault());
      setupDialog.showModal();
    }
  })();
  </script>
</body>
</html>
