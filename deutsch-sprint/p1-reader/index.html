  <script type="application/json" id="lesson-data">{"schemaVersion":1,"lessons":[{"id":"stadt-hitze","title":"Wem gehört der Schatten?","level":"C1","genre":"Kommentar","text":"Wenn eine Stadt auf mehrere heiße Tage vorbereitet sein will, reicht es nicht, einzelne Plätze nachträglich mit Sonnenschirmen auszustatten. Entscheidend ist vielmehr, ob Wege, Haltestellen und öffentliche Gebäude auch dann nutzbar bleiben, wenn die {Hitzebelastung|h1} zunimmt. Zwar schafft jeder neu gepflanzte Baum einen konkreten Ort der Erholung; dennoch muss die Planung das gesamte Viertel {in den Blick nehmen|h3}. {Versiegelte|h2} Flächen speichern Wärme, während begrünte Dächer und offene Böden Wasser aufnehmen und langsam wieder abgeben können.\n\nBefürworter argumentieren, eine konsequente Begrünung könne die {Aufenthaltsqualität|h6} erheblich verbessern. Kritiker halten dagegen, solche Maßnahmen konkurrierten mit Wohnraum, Parkplätzen und Leitungen, die unter der Erde verlaufen. Dieser Einwand ist insofern {ernst zu nehmen|h7}, als der verfügbare Raum begrenzt ist. Eine verständliche Planung sollte deshalb {offenlegen|h8}, welche Ziele miteinander {abgewogen werden|h9} und wer an der Entscheidung beteiligt war. So lässt sich vermeiden, dass eine gut gemeinte Maßnahme an den Bedürfnissen der {Anwohnenden|h4} {vorbeigeht|h10}.\n\nBei der Auswahl der Orte zählt nicht allein die erwartete Wirkung. Auch die Erreichbarkeit für Menschen mit {eingeschränkter Mobilität|h11} spielt {eine Rolle|h12}; ein kühler Innenhof hilft wenig, wenn der Zugang nur über eine steile Treppe möglich ist. Zudem muss geklärt werden, wer die Pflege übernimmt, damit neu angelegte Flächen nicht nach kurzer Zeit {verwahrlosen|h13}. Demzufolge braucht wirksame Anpassung sowohl bauliche Veränderungen als auch eine verlässliche {Zuständigkeit|h5}.\n\nDie Debatte sollte daher nicht bei der Frage stehen bleiben, ob eine Stadt „mehr Grün“ braucht. Vielmehr sind konkrete Maßnahmen, ihre Kosten und ihre Verteilung zu prüfen. Wenn Bewohnerinnen und Bewohner {frühzeitig einbezogen werden|h14}, kann aus einem abstrakten Klimaziel eine nachvollziehbare Entscheidung werden. Gerade darin liegt der Unterschied zwischen einer dekorativen Geste und einer öffentlichen Infrastruktur, die im Alltag tatsächlich schützt.","glosses":[{"id":"h1","surface":"Hitzebelastung","lemma":"Hitzebelastung","pos":"Nomen","article":"die","plural":"Hitzebelastungen","zh":"高温负担；热应激","de_def":"Belastung des Körpers oder des Alltags durch sehr hohe Temperaturen.","collocations":[{"prompt":"die Hitzebelastung ___","answer":"verringern","zh":"减轻高温负担"}],"register":"sachlich"},{"id":"h2","surface":"Versiegelte","lemma":"versiegeln","pos":"Partizip II","article":"","plural":"","zh":"被铺装覆盖的","de_def":"Mit einer dichten, meist wasserundurchlässigen Oberfläche bedeckt.","collocations":[{"prompt":"Flächen ___","answer":"versiegeln","zh":"封闭铺装地面"}],"register":"sachlich"},{"id":"h3","surface":"in den Blick nehmen","lemma":"in den Blick nehmen","pos":"Funktionsverbgefüge","article":"","plural":"","zh":"纳入考量；关注","de_def":"Etwas bei einer Untersuchung oder Entscheidung berücksichtigen.","collocations":[{"prompt":"ein ganzes Viertel ___","answer":"in den Blick nehmen","zh":"把整个街区纳入考虑"}],"register":"gehoben"},{"id":"h4","surface":"Anwohnenden","lemma":"Anwohnende","pos":"Nomen","article":"der/die","plural":"Anwohnenden","zh":"居民；附近住户","de_def":"Personen, die in der näheren Umgebung eines Ortes wohnen.","collocations":[{"prompt":"die ___ frühzeitig beteiligen","answer":"Anwohnenden","zh":"尽早让居民参与"}],"register":"neutral"},{"id":"h5","surface":"Zuständigkeit","lemma":"Zuständigkeit","pos":"Nomen","article":"die","plural":"Zuständigkeiten","zh":"职责；管辖责任","de_def":"Verantwortung für eine bestimmte Aufgabe oder einen bestimmten Bereich.","collocations":[{"prompt":"eine klare ___ festlegen","answer":"Zuständigkeit","zh":"明确职责"}],"register":"formal"},{"id":"h6","surface":"Aufenthaltsqualität","lemma":"Aufenthaltsqualität","pos":"Nomen","article":"die","plural":"Aufenthaltsqualitäten","zh":"停留环境质量","de_def":"Eigenschaft eines Ortes, an dem Menschen sich gern und sicher aufhalten.","collocations":[{"prompt":"die Aufenthaltsqualität ___","answer":"verbessern","zh":"停留环境质量"}],"register":"neutral"},{"id":"h7","surface":"ernst zu nehmen","lemma":"ernst nehmen","pos":"Funktionsverbgefüge","article":"","plural":"","zh":"认真对待","de_def":"Etwas als wichtig anerkennen und bei einer Entscheidung berücksichtigen.","collocations":[{"prompt":"einen Einwand ___","answer":"ernst nehmen","zh":"认真对待"}],"register":"formal"},{"id":"h8","surface":"offenlegen","lemma":"offenlegen","pos":"Verb","article":"","plural":"","zh":"公开说明；披露","de_def":"Informationen so mitteilen, dass sie für andere nachvollziehbar sind.","collocations":[{"prompt":"Ziele und Kosten ___","answer":"offenlegen","zh":"公开说明；披露"}],"register":"formal"},{"id":"h9","surface":"abgewogen werden","lemma":"abwägen","pos":"Verb","article":"","plural":"","zh":"被权衡","de_def":"Verschiedene Möglichkeiten oder Interessen miteinander vergleichen.","collocations":[{"prompt":"Ziele gegeneinander ___","answer":"abwägen","zh":"被权衡"}],"register":"formal"},{"id":"h10","surface":"vorbeigeht","lemma":"an jemandem vorbeigehen","pos":"Verb","article":"","plural":"","zh":"忽视；未顾及","de_def":"Die Bedürfnisse einer Person nicht berücksichtigen.","collocations":[{"prompt":"an den Bedürfnissen ___","answer":"vorbeigehen","zh":"忽视；未顾及"}],"register":"neutral"},{"id":"h11","surface":"eingeschränkter Mobilität","lemma":"eingeschränkte Mobilität","pos":"Nominalgruppe","article":"","plural":"","zh":"行动能力受限","de_def":"Begrenzte Möglichkeit, sich selbstständig und ohne Hindernisse fortzubewegen.","collocations":[{"prompt":"Menschen mit eingeschränkter ___","answer":"Mobilität","zh":"行动能力受限"}],"register":"formal"},{"id":"h12","surface":"eine Rolle","lemma":"eine Rolle spielen","pos":"Funktionsverbgefüge","article":"","plural":"","zh":"起作用；有影响","de_def":"Für eine Entscheidung oder Entwicklung wichtig sein.","collocations":[{"prompt":"bei der Auswahl eine ___ spielen","answer":"Rolle","zh":"起作用；有影响"}],"register":"neutral"},{"id":"h13","surface":"verwahrlosen","lemma":"verwahrlosen","pos":"Verb","article":"","plural":"","zh":"荒废；失于维护","de_def":"Durch fehlende Pflege in einen ungepflegten Zustand geraten.","collocations":[{"prompt":"eine Fläche verwahrlosen ___","answer":"lassen","zh":"荒废；失于维护"}],"register":"neutral"},{"id":"h14","surface":"frühzeitig einbezogen werden","lemma":"einbeziehen","pos":"Verb","article":"","plural":"","zh":"被及早纳入；尽早参与","de_def":"Schon in einer frühen Phase an einer Planung oder Entscheidung beteiligt sein.","collocations":[{"prompt":"Bewohner frühzeitig ___","answer":"einbeziehen","zh":"被及早纳入；尽早参与"}],"register":"formal"}],"questions":[{"type":"对错","q":"Der Text vertritt die Auffassung, dass zusätzliche Bäume allein eine ausreichende Anpassung an Hitze darstellen.","options":["对","错"],"answer":"错","evidence_sentence_index":2},{"type":"选择","q":"Warum soll die Planung laut Text transparent sein?","options":["Damit Zielkonflikte und Beteiligung nachvollziehbar werden.","Damit alle Parkplätze erhalten bleiben.","Damit Pflegekosten vollständig entfallen."],"answer":"Damit Zielkonflikte und Beteiligung nachvollziehbar werden.","evidence_sentence_index":7},{"type":"配对","q":"Was macht einen kühlen Innenhof im Alltag tatsächlich zugänglich?","options":["Ein stufenlos erreichbarer Zugang.","Eine dekorative Bepflanzung.","Ein höherer Zaun."],"answer":"Ein stufenlos erreichbarer Zugang.","evidence_sentence_index":10}],"summary_zh":"文章认为，城市热适应不能只靠零散增绿，还要公开权衡空间冲突，让居民参与，并明确维护责任和无障碍要求。","grammar_focus":["名词化：die Auswahl, die Zuständigkeit","分词定语：Versiegelte Flächen","Konjunktiv I：Befürworter argumentieren, … könne …","Funktionsverbgefüge：etwas in den Blick nehmen; eine Rolle spielen"],"recycled_words":[]},{"id":"hybrid-arbeit","title":"Flexibilität braucht gemeinsame Regeln","level":"C1","genre":"Bericht","text":"Hybride Arbeit wird häufig als individuelle Freiheit beschrieben: Beschäftigte können konzentrierte Aufgaben zu Hause erledigen und für Besprechungen ins Büro kommen. Diese Beschreibung {greift jedoch zu kurz|a6}, denn Flexibilität entsteht nicht automatisch durch die {Bereitstellung eines Laptops|a7}. Sie hängt auch davon ab, ob Teams gemeinsame Erwartungen an {Erreichbarkeit|a1}, Übergaben und {Entscheidungswege|a8} entwickeln. Ohne solche Absprachen kann die vermeintliche Freiheit in eine {dauernde Bereitschaft|a9} {umschlagen|a2}.\n\nIn einer Arbeitsgruppe, die ortsunabhängig zusammenarbeitet, müssen Informationen so dokumentiert werden, dass sie nicht nur den zufällig Anwesenden {zugutekommen|a10}. Eine nachvollziehbare Ablage hilft dabei, Wissen zu teilen und {unnötige Rückfragen|a11} zu vermeiden. Zugleich sollte nicht jede kurze Abstimmung zu einem formellen Protokoll werden; ein {überladenes System|a12} kostet Zeit und wird bald umgangen. Entscheidend ist vielmehr, für {wiederkehrende Entscheidungen|a13} einen passenden Ort und eine klare Form festzulegen.\n\nBefürworter betonen, die Wahl des Arbeitsortes ermögliche eine bessere {Vereinbarkeit|a3} von Beruf und Privatleben. Beschäftigte mit {Betreuungsaufgaben|a14} könnten davon besonders profitieren. Andere weisen darauf hin, dass {informeller Austausch|a15} und Zugehörigkeitsgefühl schwerer zu sichern seien, wenn sich Kolleginnen und Kollegen selten begegneten. Beide Perspektiven sind insofern berechtigt, als die Wirkung von den Aufgaben, den persönlichen Umständen und der Teamkultur abhängt.\n\nDaher sollte eine Organisation nicht allein die Anwesenheitstage zählen. Sie kann stattdessen gemeinsam prüfen, wann ein Treffen einen konkreten Zweck erfüllt und welche Tätigkeiten ungestörte Zeit benötigen. Eine regelmäßige {Rückmeldung|a4} macht sichtbar, ob die getroffenen Vereinbarungen funktionieren oder angepasst werden müssen. Zudem muss der Zugang zu wichtigen Informationen unabhängig vom Arbeitsort {gewährleistet|a5} sein.\n\nGute Regeln schreiben nicht jeden Schritt vor. Sie schaffen einen Rahmen, in dem Mitarbeitende Entscheidungen treffen können, ohne ständig ihre Verfügbarkeit beweisen zu müssen. Wenn Führungskräfte Ergebnisse klar benennen und zugleich Grenzen respektieren, wird Flexibilität zu einer verlässlichen Arbeitsform. Fehlt dieses Vertrauen, bleibt selbst ein freier Kalender nur eine andere Form der Kontrolle.","glosses":[{"id":"a1","surface":"Erreichbarkeit","lemma":"Erreichbarkeit","pos":"Nomen","article":"die","plural":"Erreichbarkeiten","zh":"可联系性；可联络程度","de_def":"Möglichkeit, eine Person zu kontaktieren oder von ihr eine Antwort zu erhalten.","collocations":[{"prompt":"klare Regeln zur ___ vereinbaren","answer":"Erreichbarkeit","zh":"约定清晰的联络规则"}],"register":"formal"},{"id":"a2","surface":"umschlagen","lemma":"umschlagen","pos":"Verb","article":"","plural":"","zh":"转变成；演变为","de_def":"Sich in etwas anderes, oft in sein Gegenteil, verwandeln.","collocations":[{"prompt":"in dauernde Bereitschaft ___","answer":"umschlagen","zh":"演变成持续待命"}],"register":"neutral"},{"id":"a3","surface":"Vereinbarkeit","lemma":"Vereinbarkeit","pos":"Nomen","article":"die","plural":"Vereinbarkeiten","zh":"兼顾；协调","de_def":"Möglichkeit, mehrere Anforderungen gleichzeitig zu erfüllen.","collocations":[{"prompt":"die ___ von Beruf und Privatleben","answer":"Vereinbarkeit","zh":"兼顾工作与私人生活"}],"register":"formal"},{"id":"a4","surface":"Rückmeldung","lemma":"Rückmeldung","pos":"Nomen","article":"die","plural":"Rückmeldungen","zh":"反馈","de_def":"Reaktion oder Information darüber, wie etwas wahrgenommen oder bewertet wird.","collocations":[{"prompt":"regelmäßig ___ geben","answer":"Rückmeldung","zh":"定期提供反馈"}],"register":"neutral"},{"id":"a5","surface":"gewährleistet","lemma":"gewährleisten","pos":"Partizip II","article":"","plural":"","zh":"得到保障的","de_def":"So sichergestellt, dass etwas zuverlässig möglich ist.","collocations":[{"prompt":"den Zugang zu Informationen ___","answer":"gewährleisten","zh":"保障信息获取"}],"register":"formal"},{"id":"a6","surface":"greift jedoch zu kurz","lemma":"zu kurz greifen","pos":"Funktionsverbgefüge","article":"","plural":"","zh":"说得不全面；过于简单","de_def":"Einen Sachverhalt nur teilweise erfassen und wichtige Aspekte auslassen.","collocations":[{"prompt":"mit einer Erklärung zu kurz ___","answer":"greifen","zh":"说得不全面；过于简单"}],"register":"formal"},{"id":"a7","surface":"Bereitstellung eines Laptops","lemma":"Bereitstellung","pos":"Nomen","article":"die","plural":"Bereitstellungen","zh":"提供；配备","de_def":"Das Zurverfügungstellen einer Sache, die benötigt wird.","collocations":[{"prompt":"die Bereitstellung von ___","answer":"Arbeitsmitteln","zh":"提供；配备"}],"register":"formal"},{"id":"a8","surface":"Entscheidungswege","lemma":"Entscheidungsweg","pos":"Nomen","article":"der","plural":"Entscheidungswege","zh":"决策流程","de_def":"Festgelegter Ablauf, auf dem eine Entscheidung vorbereitet und getroffen wird.","collocations":[{"prompt":"klare Entscheidungswege ___","answer":"entwickeln","zh":"决策流程"}],"register":"formal"},{"id":"a9","surface":"dauernde Bereitschaft","lemma":"Bereitschaft","pos":"Nomen","article":"die","plural":"Bereitschaften","zh":"持续待命状态","de_def":"Zustand, in dem jemand jederzeit mit einer Anfrage oder Aufgabe rechnet.","collocations":[{"prompt":"in dauernder Bereitschaft ___","answer":"sein","zh":"持续待命状态"}],"register":"neutral"},{"id":"a10","surface":"zugutekommen","lemma":"zugutekommen","pos":"Verb","article":"","plural":"","zh":"使……受益","de_def":"Für jemanden hilfreich oder vorteilhaft sein.","collocations":[{"prompt":"allen Teammitgliedern ___","answer":"zugutekommen","zh":"使……受益"}],"register":"neutral"},{"id":"a11","surface":"unnötige Rückfragen","lemma":"Rückfrage","pos":"Nomen","article":"die","plural":"Rückfragen","zh":"不必要的追问","de_def":"Frage, die gestellt wird, weil eine Information fehlt oder unklar ist.","collocations":[{"prompt":"unnötige Rückfragen ___","answer":"vermeiden","zh":"不必要的追问"}],"register":"neutral"},{"id":"a12","surface":"überladenes System","lemma":"überladen","pos":"Adjektiv","article":"","plural":"","zh":"过于复杂的；负担过重的","de_def":"Mit mehr Elementen oder Anforderungen versehen, als nötig oder hilfreich sind.","collocations":[{"prompt":"ein überladenes ___","answer":"System","zh":"过于复杂的；负担过重的"}],"register":"neutral"},{"id":"a13","surface":"wiederkehrende Entscheidungen","lemma":"wiederkehrend","pos":"Adjektiv","article":"","plural":"","zh":"反复出现的","de_def":"Regelmäßig erneut auftretend.","collocations":[{"prompt":"wiederkehrende Entscheidungen ___","answer":"dokumentieren","zh":"反复出现的"}],"register":"formal"},{"id":"a14","surface":"Betreuungsaufgaben","lemma":"Betreuungsaufgabe","pos":"Nomen","article":"die","plural":"Betreuungsaufgaben","zh":"照护责任","de_def":"Aufgaben, die mit der Unterstützung oder Versorgung anderer Personen verbunden sind.","collocations":[{"prompt":"berufliche und private ___","answer":"Betreuungsaufgaben","zh":"照护责任"}],"register":"neutral"},{"id":"a15","surface":"informeller Austausch","lemma":"Austausch","pos":"Nomen","article":"der","plural":"Austausche","zh":"非正式交流","de_def":"Gespräch oder Weitergabe von Informationen ohne festes Verfahren.","collocations":[{"prompt":"informeller Austausch im ___","answer":"Team","zh":"非正式交流"}],"register":"neutral"}],"questions":[{"type":"对错","q":"Der Text empfiehlt, jede kurze Abstimmung verbindlich zu protokollieren.","options":["对","错"],"answer":"错","evidence_sentence_index":6},{"type":"选择","q":"Was kann laut Text gegen unnötige Rückfragen helfen?","options":["Eine nachvollziehbare Ablage gemeinsamer Informationen.","Mehr Anwesenheitstage ohne weitere Regeln.","Eine dauernde Erreichbarkeit aller Teammitglieder."],"answer":"Eine nachvollziehbare Ablage gemeinsamer Informationen.","evidence_sentence_index":5},{"type":"配对","q":"Was soll eine regelmäßige Rückmeldung leisten?","options":["Sie zeigt, ob Vereinbarungen funktionieren.","Sie ersetzt jede Teamentscheidung.","Sie misst nur die Anwesenheit."],"answer":"Sie zeigt, ob Vereinbarungen funktionieren.","evidence_sentence_index":14}],"summary_zh":"文章指出，混合办公需要共同约定联络、信息记录和决策方式；规则既要保证协作，也要保护专注时间与信任。","grammar_focus":["名词化：die Bereitstellung, die Vereinbarkeit","分词定语：eine nachvollziehbare Ablage","Konjunktiv I：Befürworter betonen, … ermögliche …","Funktionsverbgefüge：eine Entscheidung treffen; Rückmeldung geben"],"recycled_words":["in den Blick nehmen","Zuständigkeit"]},{"id":"digitale-verwaltung","title":"Ein digitales Formular ist noch kein guter Service","level":"C1","genre":"Erklärung","text":"Wenn eine Behörde ein Formular online anbietet, gilt das oft bereits als Zeichen für Modernisierung. Für die Nutzerinnen und Nutzer ist jedoch wichtiger, ob sie {den gesamten Vorgang|v7} verstehen und abschließen können. Ein digitaler Antrag, der dieselben unklaren Begriffe wie sein {Papierpendant|v6} verwendet, {verlagert|v1} die Schwierigkeit lediglich auf einen Bildschirm. Gute Gestaltung beginnt deshalb mit der Frage, welche Information eine Person in jedem Schritt tatsächlich benötigt.\n\nEin verständlicher Dienst erklärt {Fachbegriffe|v8} dort, wo sie gebraucht werden, und macht deutlich, welche Unterlagen noch fehlen. Zugleich sollte die {Dateneingabe|v2} {auf das notwendige Maß|v9} begrenzt bleiben. Werden Angaben {mehrfach abgefragt|v10}, entsteht nicht nur {zusätzlicher Aufwand|v11}; auch die Bereitschaft, den Vorgang fortzusetzen, kann sinken. Eine {sorgfältige Überprüfung|v12} der Formulierungen hilft, Missverständnisse schon vor der Veröffentlichung zu erkennen.\n\nBefürworter digitaler Angebote sagen, ein zentral erreichbarer Dienst spare Wege und erleichtere den Zugang. Das kann zutreffen, sofern Menschen mit {unterschiedlichen Kenntnissen|v13} und Fähigkeiten berücksichtigt werden. Wer etwa ein Gerät gemeinsam nutzt oder Unterstützung beim Lesen braucht, hat nicht immer die {gleichen Voraussetzungen|v14} wie eine routinierte Nutzerin. Insofern ist {Barrierefreiheit|v3} kein Zusatz, der erst am Ende geprüft werden darf. Sie gehört zur Entwicklung von Anfang an.\n\nAuch ein digitaler Vorgang benötigt eine klare Zuständigkeit. Wenn eine Eingabe an mehreren Stellen bearbeitet wird, muss erkennbar sein, wer Rückfragen beantwortet und wie sich der {Bearbeitungsstand|v4} verfolgen lässt. Andernfalls bleibt die technische Bestätigung ohne praktischen Wert. Die Verwaltung sollte außerdem eine {erreichbare Alternative|v15} anbieten, falls der Onlineweg nicht funktioniert.\n\nDemzufolge besteht Fortschritt nicht darin, möglichst viele Formulare ins Netz zu stellen. Entscheidend ist, ob ein Service verständlich, zugänglich und verlässlich ist. Regelmäßige {Rückmeldungen|v5} der Nutzenden können aufzeigen, an welcher Stelle Schwierigkeiten auftreten. Werden diese Hinweise ernst genommen, lässt sich ein digitales Angebot Schritt für Schritt verbessern, ohne den persönlichen Kontakt als notwendige Ergänzung auszuschließen.","glosses":[{"id":"v1","surface":"verlagert","lemma":"verlagern","pos":"Verb","article":"","plural":"","zh":"转移；挪到别处","de_def":"Etwas an einen anderen Ort oder in einen anderen Bereich verschieben.","collocations":[{"prompt":"die Schwierigkeit auf einen Bildschirm ___","answer":"verlagern","zh":"把困难转移到屏幕上"}],"register":"neutral"},{"id":"v2","surface":"Dateneingabe","lemma":"Dateneingabe","pos":"Nomen","article":"die","plural":"Dateneingaben","zh":"数据录入","de_def":"Eintragen von Informationen in ein digitales System.","collocations":[{"prompt":"die ___ auf das notwendige Maß begrenzen","answer":"Dateneingabe","zh":"把数据录入限制在必要范围内"}],"register":"formal"},{"id":"v3","surface":"Barrierefreiheit","lemma":"Barrierefreiheit","pos":"Nomen","article":"die","plural":"meist ohne Plural","zh":"无障碍；可及性","de_def":"Gestaltung, die Menschen mit unterschiedlichen Fähigkeiten eine Nutzung ermöglicht.","collocations":[{"prompt":"___ von Anfang an mitdenken","answer":"Barrierefreiheit","zh":"从一开始就考虑无障碍"}],"register":"formal"},{"id":"v4","surface":"Bearbeitungsstand","lemma":"Bearbeitungsstand","pos":"Nomen","article":"der","plural":"Bearbeitungsstände","zh":"处理进度；办理状态","de_def":"Aktueller Stand, den ein Vorgang innerhalb seiner Bearbeitung erreicht hat.","collocations":[{"prompt":"den ___ nachvollziehen können","answer":"Bearbeitungsstand","zh":"能够了解办理进度"}],"register":"formal"},{"id":"v5","surface":"Rückmeldungen","lemma":"Rückmeldung","pos":"Nomen","article":"die","plural":"Rückmeldungen","zh":"反馈；意见","de_def":"Informationen von Nutzenden darüber, wie sie ein Angebot erleben.","collocations":[{"prompt":"___ der Nutzenden ernst nehmen","answer":"Rückmeldungen","zh":"认真对待使用者反馈"}],"register":"neutral"},{"id":"v6","surface":"Papierpendant","lemma":"Papierpendant","pos":"Nomen","article":"das","plural":"Papierpendants","zh":"纸质对应版本","de_def":"Die entsprechende Ausführung eines digitalen Angebots auf Papier.","collocations":[{"prompt":"das digitale Formular und sein ___","answer":"Papierpendant","zh":"纸质对应版本"}],"register":"formal"},{"id":"v7","surface":"den gesamten Vorgang","lemma":"Vorgang","pos":"Nomen","article":"der","plural":"Vorgänge","zh":"整个办理流程","de_def":"Abfolge zusammengehöriger Schritte, durch die etwas erledigt wird.","collocations":[{"prompt":"einen Vorgang ___","answer":"abschließen","zh":"整个办理流程"}],"register":"formal"},{"id":"v8","surface":"Fachbegriffe","lemma":"Fachbegriff","pos":"Nomen","article":"der","plural":"Fachbegriffe","zh":"专业术语","de_def":"Wort oder Ausdruck, der in einem bestimmten Wissensgebiet verwendet wird.","collocations":[{"prompt":"einen Fachbegriff verständlich ___","answer":"erklären","zh":"专业术语"}],"register":"formal"},{"id":"v9","surface":"auf das notwendige Maß","lemma":"notwendiges Maß","pos":"Nominalgruppe","article":"das","plural":"","zh":"必要范围","de_def":"Der Umfang, der für einen Zweck tatsächlich gebraucht wird.","collocations":[{"prompt":"auf das notwendige Maß ___","answer":"begrenzen","zh":"必要范围"}],"register":"formal"},{"id":"v10","surface":"mehrfach abgefragt","lemma":"abfragen","pos":"Verb","article":"","plural":"","zh":"被重复询问／录入","de_def":"Eine Information wiederholt erfragen oder in ein System eintragen lassen.","collocations":[{"prompt":"Angaben mehrfach ___","answer":"abfragen","zh":"被重复询问／录入"}],"register":"formal"},{"id":"v11","surface":"zusätzlicher Aufwand","lemma":"Aufwand","pos":"Nomen","article":"der","plural":"Aufwände","zh":"额外工作量","de_def":"Zeit und Mühe, die zusätzlich für eine Aufgabe benötigt werden.","collocations":[{"prompt":"zusätzlichen Aufwand ___","answer":"verursachen","zh":"额外工作量"}],"register":"formal"},{"id":"v12","surface":"sorgfältige Überprüfung","lemma":"Überprüfung","pos":"Nomen","article":"die","plural":"Überprüfungen","zh":"仔细核查","de_def":"Genaues Kontrollieren, ob etwas richtig und verständlich ist.","collocations":[{"prompt":"eine sorgfältige Überprüfung ___","answer":"durchführen","zh":"仔细核查"}],"register":"formal"},{"id":"v13","surface":"unterschiedlichen Kenntnissen","lemma":"Kenntnis","pos":"Nomen","article":"die","plural":"Kenntnisse","zh":"不同的知识水平","de_def":"Wissen oder Vertrautheit mit einem Thema oder einer Tätigkeit.","collocations":[{"prompt":"über unterschiedliche Kenntnisse ___","answer":"verfügen","zh":"不同的知识水平"}],"register":"neutral"},{"id":"v14","surface":"gleichen Voraussetzungen","lemma":"Voraussetzung","pos":"Nomen","article":"die","plural":"Voraussetzungen","zh":"相同的条件","de_def":"Bedingung, die erfüllt sein muss, damit etwas möglich ist.","collocations":[{"prompt":"nicht dieselben Voraussetzungen ___","answer":"haben","zh":"相同的条件"}],"register":"formal"},{"id":"v15","surface":"erreichbare Alternative","lemma":"Alternative","pos":"Nomen","article":"die","plural":"Alternativen","zh":"可联系到的替代方式","de_def":"Andere Möglichkeit, die tatsächlich genutzt werden kann.","collocations":[{"prompt":"eine erreichbare Alternative ___","answer":"anbieten","zh":"可联系到的替代方式"}],"register":"formal"}],"questions":[{"type":"对错","q":"Der Text setzt digitale Verwaltung mit einer vollständigen Abschaffung persönlicher Hilfe gleich.","options":["对","错"],"answer":"错","evidence_sentence_index":20},{"type":"选择","q":"Wann kann ein digitaler Dienst den Zugang tatsächlich erleichtern?","options":["Wenn unterschiedliche Kenntnisse und Fähigkeiten berücksichtigt werden.","Wenn alle Nutzerinnen und Nutzer dieselben Geräte verwenden.","Wenn Fachbegriffe nicht erklärt werden."],"answer":"Wenn unterschiedliche Kenntnisse und Fähigkeiten berücksichtigt werden.","evidence_sentence_index":9},{"type":"配对","q":"Welche Informationen sind für die Nachverfolgung eines digitalen Vorgangs wichtig?","options":["Wer Rückfragen beantwortet und wie sich der Bearbeitungsstand verfolgen lässt.","Wie viele Pflichtfelder andere Formulare enthalten.","Welche Papierformulare vollständig abgeschafft werden."],"answer":"Wer Rückfragen beantwortet und wie sich der Bearbeitungsstand verfolgen lässt.","evidence_sentence_index":14}],"summary_zh":"文章认为，数字政务的质量取决于流程是否清晰、数据采集是否必要、无障碍是否从设计之初考虑，以及是否有明确责任人与线下替代方式。","grammar_focus":["名词化：die Dateneingabe, die Überprüfung","分词定语：ein zentral erreichbarer Dienst","Konjunktiv I：Befürworter sagen, … spare …","Funktionsverbgefüge：Rückmeldungen ernst nehmen; eine Alternative anbieten"],"recycled_words":["Zuständigkeit","Rückmeldung","insofern"]}]}</script>
  <script>
  (()=>{
    'use strict';
    const EMBEDDED=JSON.parse(document.getElementById('lesson-data').textContent);
    const KEY='deutschSprint.reader.v1';
    let saved={};
    try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
    let lessons=Array.isArray(saved.lessons)&&saved.lessons.length?saved.lessons:EMBEDDED.lessons;
    let currentId=lessons.some(x=>x.id===saved.currentId)?saved.currentId:lessons[0]?.id;
    let theme=saved.theme||'system',blind=false,summaryOpen=false,visibleResults=null,toastTimer;
    let progress=saved.progress&&typeof saved.progress==='object'?saved.progress:{};
    const app=document.getElementById('reader-app');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const current=()=>lessons.find(l=>l.id===currentId)||lessons[0];
    function effectiveTheme(){return theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme}
    function persist(){try{localStorage.setItem(KEY,JSON.stringify({lessons:lessons===EMBEDDED.lessons?undefined:lessons,currentId,theme,progress}))}catch{toast('本地保存失败，请导出或清理浏览器存储。')}}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
    function sentences(text){return text.split(/\n+/).flatMap(p=>p.trim().split(/(?<=[.!?。！？])\s+(?=[{„A-ZÄÖÜ])/).map(s=>s.trim()).filter(Boolean))}
    function plainSentence(text){return text.replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'$1')}
    function wordCount(text){return plainSentence(text).trim().split(/\s+/).filter(Boolean).length}
    function glossCard(g){const article=[g.article,g.lemma].filter(Boolean).join(' ');const plural=g.plural?`复数：${g.plural}`:'';const coll=(g.collocations||[]).map(c=>typeof c==='string'?c:`${c.prompt} → ${c.answer}`).join('；');return `<div class="gloss-title">${esc(article||g.surface)} <span class="small-muted">${esc(g.pos)}</span></div><p class="gloss-zh">${esc(g.zh)} ${plural?`<span class="small-muted">· ${esc(plural)}</span>`:''}</p><p class="gloss-def">${esc(g.de_def)}</p>${coll?`<p class="gloss-extra"><strong>搭配：</strong>${esc(coll)}</p>`:''}<p class="gloss-extra">语域：${esc(g.register||'—')}</p>`}
    function renderText(lesson){const map=new Map((lesson.glosses||[]).map(g=>[g.id,g]));let index=0;return lesson.text.split(/\n+/).filter(p=>p.trim()).map(paragraph=>`<div class="paragraph">${paragraph.trim().split(/(?<=[.!?。！？])\s+(?=[{„A-ZÄÖÜ])/).filter(Boolean).map(sentence=>{const n=index++;const html=sentence.replace(/\{([^{}|]+)\|([^{}|]+)\}/g,(whole,surface,id)=>{const g=map.get(id);if(!g)return esc(surface);const tipId=`tip-${esc(id)}-${n}`;return `<span class="gloss-wrap"><button class="gloss-word" type="button" data-gloss-toggle aria-expanded="false" aria-describedby="${tipId}" aria-label="显示释义：${esc(surface)}">${esc(surface)}</button><span class="gloss-pop" id="${tipId}" role="tooltip">${glossCard(g)}</span></span>`});return `<span class="sentence" data-sentence-index="${n}">${html}</span>`}).join(' ')}</div>`).join('')}
    function latestBlind(lesson){const attempts=progress[lesson.id]||[];return [...attempts].reverse().find(a=>a.blind)||null}
    function renderQuestions(lesson){const last=latestBlind(lesson);const allAttempts=progress[lesson.id]||[];let html=`<section class="quiz-box" aria-labelledby="quiz-title"><div class="section-heading"><div><h3 id="quiz-title">阅读理解自测</h3><p>先自己作答，提交后才显示答案和证据句。</p></div><span class="badge">${lesson.questions.length} 题</span></div>${last?`<p class="status">最近一次盲读自测：${last.score}/${last.total} · ${esc(last.date)}</p>`:''}<p class="status" id="quiz-status" role="status" aria-live="polite"></p>`;
      html+=lesson.questions.map((q,i)=>`<fieldset class="question" style="border:0;padding-left:0;padding-right:0;margin:0"><legend class="question-title"><span class="question-type">${esc(q.type)}</span>${esc(q.q)}</legend><div class="options">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="answer-${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div><div class="feedback hidden" id="feedback-${i}"></div></fieldset>`).join('');
      html+=`<div class="quiz-footer"><p>盲读模式下提交才会记入盲读自测分数。${allAttempts.length?` 已完成 ${allAttempts.length} 次自测。`:''}</p><button class="btn btn-primary" data-action="submit-quiz">提交答案</button></div></section>`;return html}
    function render(){const lesson=current();if(!lesson){app.innerHTML='<p>没有可用课件。</p>';return}document.documentElement.dataset.theme=effectiveTheme();const nav=lessons.map((l,i)=>`<button class="nav-item" data-lesson="${esc(l.id)}" aria-current="${l.id===lesson.id?'page':'false'}"><span class="nav-number">${String(i+1).padStart(2,'0')}</span><span class="nav-label">${esc(l.title)}<span class="nav-meta">${esc(l.level)} · ${esc(l.genre)}</span></span></button>`).join('');const blindScore=latestBlind(lesson);const blindCount=(progress[lesson.id]||[]).filter(a=>a.blind).length;
      app.innerHTML=`<header class="topbar"><a class="brand" href="../index.html"><span class="mark">DS</span><span><span class="brand-title">Deutsch Sprint</span><span class="brand-sub">C1 reading studio</span></span></a><div class="actions"><button class="btn btn-secondary" data-action="import">导入 JSON</button><button class="btn btn-secondary" data-action="export">导出本篇 JSON</button><button class="icon" data-action="theme" aria-label="切换明暗主题" title="切换明暗主题">${effectiveTheme()==='dark'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 5.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>'}</button></div></header>
      <section class="intro"><div><p class="eyebrow">B2–C1 · LESEN</p><h1>读懂句子，也读懂论证</h1><p>精读 · 词块 · 语法聚焦 · 阅读自测</p></div><div class="local-note"><span class="local-dot"></span>课件原创生成 · 仅作练习</div></section>
      <div class="grid"><nav class="lesson-nav" aria-label="课件列表">${nav}<button class="nav-item" data-action="reset-lessons"><span class="nav-number">↺</span><span class="nav-label">恢复内置课件<span class="nav-meta">重置为示例文章</span></span></button></nav>
        <main class="content" id="reader-main" tabindex="-1"><header class="article-head"><div class="article-topline"><div class="badge-row"><span class="badge">${esc(lesson.level)}</span><span class="badge">${esc(lesson.genre)}</span><span class="badge ai">AI 生成 · 仅作练习</span></div><span class="article-meta">约 ${wordCount(lesson.text)} 词</span></div><h2>${esc(lesson.title)}</h2><div class="article-meta">${lessons.indexOf(lesson)+1} / ${lessons.length} 篇 · 鼠标悬停或点按标记词查看释义</div><div class="article-controls"><button class="btn" data-action="blind" aria-pressed="${blind}">${blind?'退出盲读模式':'盲读模式'}</button><button class="btn" data-action="summary">${summaryOpen?'隐藏中文摘要':'显示中文摘要'}</button><button class="btn" data-action="export">导出本篇 JSON</button></div><div class="summary"><button class="summary-button" data-action="summary">${summaryOpen?'隐藏中文摘要':'显示中文摘要'}</button><p class="summary-text" ${summaryOpen?'':'hidden'}>${esc(lesson.summary_zh)}</p></div></header>
        <article class="article-box" lang="de"><div class="article-text">${renderText(lesson)}</div></article>${renderQuestions(lesson)}</main>
        <aside class="aside" aria-label="本篇学习信息"><section class="side-box"><h3>盲读自测</h3><div class="metric"><strong>${blindCount}</strong><span>次</span></div><p>先开盲读模式阅读，再完成下方题目。自测分数只保存在当前浏览器。</p>${blindScore?`<span class="score-pill">最近 ${blindScore.score} / ${blindScore.total}</span>`:'<span class="score-pill">尚无记录</span>'}</section><section class="side-box"><h3>语法聚焦</h3><ul class="detail-list">${(lesson.grammar_focus||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="side-box"><h3>回收词块</h3>${lesson.recycled_words?.length?`<div class="recycled">${lesson.recycled_words.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'<p>这是当前词汇链的起始篇。</p>'}</section></aside></div><p class="foot">练习文章为原创 AI 生成文本，不代表新闻报道或真实引语。进度保存在此浏览器。</p>`;
      document.body.classList.toggle('blind',blind);document.querySelectorAll('[data-gloss-toggle]').forEach(b=>{b.disabled=blind;b.tabIndex=blind?-1:0});
      if(visibleResults){showResults(visibleResults);visibleResults=null}
    }
    function showResults(results){const lesson=current();results.forEach((r,i)=>{const q=lesson.questions[i],box=document.getElementById(`feedback-${i}`);if(!box)return;const parts=sentences(lesson.text);const evidence=plainSentence(parts[q.evidence_sentence_index]||'');box.classList.remove('hidden');box.classList.add(r.correct?'correct':'wrong');box.innerHTML=`<strong>${r.correct?'正确':'再看一遍'}</strong> · 正确答案：${esc(q.answer)}<p>证据句：${esc(evidence)}</p>`})}
    function validateCollection(value){const list=Array.isArray(value)?value:Array.isArray(value?.lessons)?value.lessons:[value];if(!list.length)return 'JSON 中没有课件。';for(let i=0;i<list.length;i++){const l=list[i];if(!l||typeof l!=='object'||!l.id||!l.title||!l.text||!Array.isArray(l.glosses)||!Array.isArray(l.questions))return `第 ${i+1} 篇缺少 id、title、text、glosses 或 questions。`;if(l.questions.some(q=>!q.q||!Array.isArray(q.options)||!q.answer||!Number.isInteger(q.evidence_sentence_index)))return `第 ${i+1} 篇的题目格式不完整。`}return ''}
    function exportLesson(){const lesson=current();const blob=new Blob([JSON.stringify(lesson,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`p1-${lesson.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('本篇 JSON 已导出，可交给 P2 卡片工厂。')}
    function importFile(file){const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(String(reader.result||''));const issue=validateCollection(value);if(issue){alert(`导入失败：${issue}`);return}lessons=Array.isArray(value)?value:Array.isArray(value.lessons)?value.lessons:[value];currentId=lessons[0].id;progress={};blind=false;summaryOpen=false;persist();render();toast('课件已导入')}catch{alert('无法读取 JSON，请检查文件格式。')}};reader.readAsText(file)}
    document.addEventListener('click',event=>{const nav=event.target.closest('[data-lesson]');if(nav){currentId=nav.dataset.lesson;blind=false;summaryOpen=false;visibleResults=null;persist();render();return}const action=event.target.closest('[data-action]')?.dataset.action;if(action==='blind'){blind=!blind;document.body.classList.toggle('blind',blind);document.querySelectorAll('[data-gloss-toggle]').forEach(b=>{b.disabled=blind;b.tabIndex=blind?-1:0});const button=document.querySelector('[data-action="blind"]');button.setAttribute('aria-pressed',String(blind));button.textContent=blind?'退出盲读模式':'盲读模式';document.querySelectorAll('.gloss-wrap').forEach(x=>x.classList.remove('open'));return}if(action==='summary'){summaryOpen=!summaryOpen;document.querySelectorAll('.summary-text').forEach(x=>x.hidden=!summaryOpen);document.querySelectorAll('[data-action="summary"]').forEach(x=>x.textContent=summaryOpen?'隐藏中文摘要':'显示中文摘要');return}if(action==='theme'){theme=effectiveTheme()==='dark'?'light':'dark';persist();render();return}if(action==='export'){exportLesson();return}if(action==='import'){document.getElementById('lesson-file').click();return}if(action==='reset-lessons'){if(confirm('恢复内置示例课件？已导入的课件列表会被替换。')){lessons=EMBEDDED.lessons;currentId=lessons[0]?.id;progress={};blind=false;summaryOpen=false;try{localStorage.removeItem(KEY)}catch{}render();toast('已恢复内置课件')}return}const gloss=event.target.closest('[data-gloss-toggle]');if(gloss){if(blind)return;const wrap=gloss.closest('.gloss-wrap');document.querySelectorAll('.gloss-wrap.open').forEach(x=>{if(x!==wrap){x.classList.remove('open');x.querySelector('[data-gloss-toggle]')?.setAttribute('aria-expanded','false')}});const open=wrap.classList.toggle('open');gloss.setAttribute('aria-expanded',String(open));return}if(!event.target.closest('.gloss-wrap'))document.querySelectorAll('.gloss-wrap.open').forEach(x=>{x.classList.remove('open');x.querySelector('[data-gloss-toggle]')?.setAttribute('aria-expanded','false')})});
    document.addEventListener('change',event=>{if(event.target.id==='lesson-file'&&event.target.files?.[0]){importFile(event.target.files[0]);event.target.value=''}});
    document.addEventListener('click',event=>{if(event.target.closest('[data-action="submit-quiz"]')){const lesson=current(),answers=lesson.questions.map((q,i)=>document.querySelector(`input[name="answer-${i}"]:checked`)?.value||'');if(answers.some(x=>!x)){document.getElementById('quiz-status').textContent='请先完成所有题目，再提交。';return}const results=lesson.questions.map((q,i)=>({correct:answers[i]===q.answer}));const score=results.filter(r=>r.correct).length;const today=new Intl.DateTimeFormat('sv-SE').format(new Date());const entry={date:today,score,total:lesson.questions.length,blind};progress[lesson.id]=[...(progress[lesson.id]||[]),entry].slice(-50);persist();visibleResults=results;render();document.getElementById('quiz-title')?.scrollIntoView({behavior:'smooth',block:'start'});toast(blind?'盲读自测成绩已记录':'自测结果已显示');}});
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(theme==='system')render()});
    render();
  })();
  </script>
