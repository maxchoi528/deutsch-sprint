<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Deutsch Sprint · B2–C1 精读</title>
  <style>
    :root {
      color-scheme: light;
      --canvas:#f5f4ef; --surface:#fffefa; --surface2:#f0efe9; --ink:#1e2925; --muted:#69756f;
      --line:#dfe2db; --accent:#285e4d; --accentStrong:#174635; --accentSoft:#e4eee8;
      --gold:#b9773d; --goldSoft:#f6eadc; --red:#a7463b; --redSoft:#f7e8e4; --focus:#ac6b2f;
      --shadow:0 10px 32px rgba(36,47,41,.055); --radius:17px;
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-synthesis:none;
    }
    [data-theme="dark"] { color-scheme:dark; --canvas:#171d1a; --surface:#202823; --surface2:#29322c; --ink:#edf2ed; --muted:#a6b1a9; --line:#3a473f; --accent:#8bc0a6; --accentStrong:#a8d4bb; --accentSoft:#293d33; --gold:#e3ad78; --goldSoft:#453528; --red:#e0988a; --redSoft:#442e2a; --focus:#e3ad78; --shadow:0 10px 32px rgba(0,0,0,.18); }
    *{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5}
    button,input{font:inherit;color:inherit} button{cursor:pointer} :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .skip{position:absolute;top:-50px;left:12px;z-index:20;padding:10px 13px;background:var(--surface);border-radius:9px}.skip:focus{top:12px}
    .app{max-width:1500px;margin:auto;padding:0 30px 50px}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accentStrong);color:white;font-size:12px;font-weight:800;letter-spacing:-.05em}[data-theme=dark] .mark{color:#17211b}
    .brand-title{font-size:13px;font-weight:750;letter-spacing:.02em}.brand-sub{display:block;margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
    .actions{display:flex;gap:7px;align-items:center}.btn,.icon{min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:background .16s ease,border-color .16s ease}.btn:hover,.icon:hover{background:var(--surface2)}.icon{width:40px;padding:0;display:grid;place-items:center}.icon svg{width:17px;height:17px}.btn-primary{border-color:var(--accentStrong);background:var(--accentStrong);color:white;font-weight:650}[data-theme=dark] .btn-primary{color:#17211b}.btn-primary:hover{filter:brightness(1.08)}.btn[aria-pressed=true]{border-color:var(--accent);background:var(--accentSoft);color:var(--accentStrong);font-weight:700}
    .intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:28px 0 19px}.eyebrow{margin:0 0 7px;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.intro h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,3vw,36px);font-weight:500;letter-spacing:-.035em;line-height:1.15}.intro p{margin:7px 0 0;color:var(--muted);font-size:13px}.local-note{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:var(--surface);font-size:11px;white-space:nowrap}.local-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .grid{display:grid;grid-template-columns:205px minmax(0,1fr) 235px;gap:17px;align-items:start}.lesson-nav,.aside{position:sticky;top:15px}.lesson-nav{display:grid;gap:6px}.nav-item{width:100%;display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:center;padding:11px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left}.nav-item:hover{background:var(--surface2)}.nav-item[aria-current=page]{border-color:var(--line);background:var(--surface);box-shadow:var(--shadow)}.nav-number{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:var(--surface2);color:var(--muted);font-size:10px;font-weight:800}.nav-item[aria-current=page] .nav-number{background:var(--accentSoft);color:var(--accentStrong)}.nav-label{font-size:12px;font-weight:650;line-height:1.3}.nav-meta{display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:500}.level-filter{display:grid;gap:5px;margin:0 0 5px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font-size:10px;font-weight:650}.level-filter select{width:100%;min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:12px}.filter-empty{padding:8px;color:var(--muted);font-size:11px}
    .content{min-width:0}.article-head,.article-box,.quiz-box,.side-box{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}.article-head{padding:22px 24px 18px}.article-topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge-row{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:99px;color:var(--blue,#597493);background:var(--blueSoft,#e8edf3);font-size:10px;font-weight:750}.badge.ai{color:var(--gold);background:var(--goldSoft)}.article-head h2{margin:12px 0 5px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,2.4vw,32px);font-weight:500;letter-spacing:-.03em;line-height:1.15}.article-meta{color:var(--muted);font-size:11px}.article-controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.article-box{margin-top:12px;padding:24px 27px}.article-text{max-width:770px;font-family:Georgia,"Noto Serif",serif;font-size:19px;line-height:1.86;letter-spacing:.002em}.paragraph{margin:0 0 17px}.paragraph:last-child{margin-bottom:0}.sentence{border-radius:3px}.gloss-wrap{position:relative;display:inline}.gloss-word{padding:0;border:0;border-bottom:1px dotted var(--accent);color:var(--accentStrong);background:transparent;font:inherit;cursor:pointer}.gloss-word:hover,.gloss-word:focus-visible{background:var(--accentSoft)}.gloss-pop{position:absolute;z-index:10;left:50%;bottom:calc(100% + 8px);width:min(330px,80vw);padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 12px 34px rgba(0,0,0,.16);font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;line-height:1.5;opacity:0;visibility:hidden;transform:translate(-50%,5px);transition:opacity .14s ease,transform .14s ease}.gloss-wrap:hover .gloss-pop,.gloss-wrap:focus-within .gloss-pop,.gloss-wrap.open .gloss-pop{opacity:1;visibility:visible;transform:translate(-50%,0)}.gloss-title{margin:0 0 5px;font-size:13px;font-weight:750}.gloss-zh{margin:0 0 7px;color:var(--gold);font-weight:700}.gloss-def{margin:0;color:var(--muted)}.gloss-extra{margin:7px 0 0;padding-top:7px;border-top:1px solid var(--line);color:var(--ink);font-size:11px}.blind .gloss-word{border-bottom-color:transparent;color:inherit;cursor:text}.blind .gloss-pop{display:none!important}
    .aside{display:grid;gap:12px}.side-box{padding:16px}.side-box h3{margin:0 0 9px;font-size:12px;font-weight:750}.side-box p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.metric{display:flex;align-items:baseline;gap:5px;margin:4px 0 8px}.metric strong{font-size:25px;letter-spacing:-.05em}.metric span{color:var(--muted);font-size:11px}.score-pill{display:inline-flex;margin-top:10px;padding:5px 8px;border-radius:8px;background:var(--accentSoft);color:var(--accentStrong);font-size:10px;font-weight:700}.detail-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}.detail-list li{padding-top:8px;border-top:1px solid var(--line);font-size:11px;line-height:1.45}.detail-list li:first-child{padding-top:0;border-top:0}.detail-list span{display:block;margin-top:3px;color:var(--muted)}.recycled{display:flex;flex-wrap:wrap;gap:5px}.recycled span{padding:4px 7px;border-radius:7px;background:var(--surface2);color:var(--muted);font-size:10px}
    .summary{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.summary-button{padding:0;border:0;color:var(--accentStrong);background:none;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px}.summary-text{margin:9px 0 0;padding:12px;border-radius:10px;background:var(--goldSoft);font-size:12px;line-height:1.65}.summary-text[hidden]{display:none}
    .quiz-box{margin-top:12px;padding:21px 24px}.section-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:13px}.section-heading h3{margin:0;font-size:15px}.section-heading p{margin:4px 0 0;color:var(--muted);font-size:11px}.question{padding:13px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.question-title{margin:0 0 9px;font-size:13px;font-weight:650}.question-type{margin-right:7px;color:var(--muted);font-size:10px;font-weight:600}.options{display:grid;gap:5px}.option{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;font-size:12px;cursor:pointer}.option:hover{background:var(--surface2)}.option input{margin:3px 0 0;accent-color:var(--accentStrong)}.feedback{margin-top:8px;padding:9px 10px;border-radius:8px;background:var(--surface2);font-size:11px}.feedback.correct{background:var(--accentSoft);color:var(--accentStrong)}.feedback.wrong{background:var(--redSoft);color:var(--red)}.feedback p{margin:4px 0 0;color:var(--muted)}.quiz-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}.quiz-footer p{margin:0;color:var(--muted);font-size:11px}.status{margin:0 0 12px;color:var(--accentStrong);font-size:11px;font-weight:700}.status:empty{display:none}.toast{position:fixed;right:18px;bottom:18px;z-index:40;padding:10px 14px;border-radius:10px;background:#263b31;color:#fff;font-size:12px;opacity:0;transform:translateY(6px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.foot{margin-top:18px;color:var(--muted);text-align:center;font-size:10px}.hidden{display:none!important}
    @media(max-width:1120px){.grid{grid-template-columns:180px minmax(0,1fr)}.aside{position:static;grid-column:2;grid-template-columns:repeat(2,minmax(0,1fr))}.aside .side-box:last-child{grid-column:1/-1}}
    @media(max-width:720px){.app{padding:0 14px 34px}.topbar{height:65px}.actions .btn-secondary{display:none}.intro{align-items:flex-start;flex-direction:column;padding:22px 0 14px;gap:10px}.grid{grid-template-columns:1fr;gap:12px}.lesson-nav{position:static;display:flex;gap:5px;overflow-x:auto;margin:0 -14px;padding:0 14px 5px}.nav-item{flex:0 0 185px;width:185px;padding:8px}.content{min-width:0}.aside{grid-column:auto;grid-template-columns:1fr 1fr}.aside .side-box:last-child{grid-column:1/-1}.article-head{padding:18px}.article-box{padding:19px}.article-text{font-size:18px;line-height:1.78}.quiz-box{padding:17px}.gloss-pop{position:fixed;left:50%;bottom:14px;top:auto;width:min(340px,calc(100vw - 28px));transform:translate(-50%,6px)}.gloss-wrap.open .gloss-pop,.gloss-wrap:focus-within .gloss-pop{transform:translate(-50%,0)}.quiz-footer{align-items:flex-start;flex-direction:column}.local-note{font-size:10px}}
    @media(max-width:410px){.brand-sub{display:none}.icon{width:38px;min-height:38px}.badge{font-size:9px}.article-controls .btn{min-height:38px;padding:0 10px;font-size:11px}.aside{grid-template-columns:1fr}.aside .side-box:last-child{grid-column:auto}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <a class="skip" href="#reader-main">跳到课文</a>
  <div class="app" id="reader-app"></div>
  <input class="hidden" type="file" id="lesson-file" accept="application/json,.json">
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="application/json" id="lesson-data">__LESSON_JSON__</script>
  <script>
  (()=>{
    'use strict';
    const EMBEDDED=JSON.parse(document.getElementById('lesson-data').textContent);
    const KEY='deutschSprint.reader.v1';
    let saved={};
    try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
    let lessons=Array.isArray(saved.lessons)&&saved.lessons.length?saved.lessons:EMBEDDED.lessons;
    let currentId=lessons.some(x=>x.id===saved.currentId)?saved.currentId:(lessons.find(l=>l.level==='B2')||lessons[0])?.id;
    let theme=saved.theme||'system',levelFilter=saved.levelFilter||'all',blind=false,summaryOpen=false,visibleResults=null,toastTimer;
    let progress=saved.progress&&typeof saved.progress==='object'?saved.progress:{};
    const app=document.getElementById('reader-app');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const current=()=>lessons.find(l=>l.id===currentId)||lessons[0];
    function effectiveTheme(){return theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme}
    function persist(){try{localStorage.setItem(KEY,JSON.stringify({lessons:lessons===EMBEDDED.lessons?undefined:lessons,currentId,theme,levelFilter,progress}))}catch{toast('本地保存失败，请导出或清理浏览器存储。')}}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
    function sentences(text){return text.split(/\n+/).flatMap(p=>p.trim().split(/(?<=[.!?。！？])\s+(?=[{„A-ZÄÖÜ])/).map(s=>s.trim()).filter(Boolean))}
    function plainSentence(text){return text.replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'$1')}
    function wordCount(text){return plainSentence(text).trim().split(/\s+/).filter(Boolean).length}
    function glossCard(g){const article=[g.article,g.lemma].filter(Boolean).join(' ');const plural=g.plural?`复数：${g.plural}`:(g.plural_note||'');const coll=(g.collocations||[]).map(c=>typeof c==='string'?c:`${c.prompt} → ${c.answer}`).join('；');return `<div class="gloss-title">${esc(article||g.surface)} <span class="small-muted">${esc(g.pos)}</span></div><p class="gloss-zh">${esc(g.zh)} ${plural?`<span class="small-muted">· ${esc(plural)}</span>`:''}</p><p class="gloss-def">${esc(g.de_def)}</p>${coll?`<p class="gloss-extra"><strong>搭配：</strong>${esc(coll)}</p>`:''}<p class="gloss-extra">语域：${esc(g.register||'—')}</p>`}
    function renderText(lesson){const map=new Map((lesson.glosses||[]).map(g=>[g.id,g]));let index=0;return lesson.text.split(/\n+/).filter(p=>p.trim()).map(paragraph=>`<div class="paragraph">${paragraph.trim().split(/(?<=[.!?。！？])\s+(?=[{„A-ZÄÖÜ])/).filter(Boolean).map(sentence=>{const n=index++;const html=sentence.replace(/\{([^{}|]+)\|([^{}|]+)\}/g,(whole,surface,id)=>{const g=map.get(id);if(!g)return esc(surface);const tipId=`tip-${esc(id)}-${n}`;return `<span class="gloss-wrap"><button class="gloss-word" type="button" data-gloss-toggle aria-expanded="false" aria-describedby="${tipId}" aria-label="显示释义：${esc(surface)}">${esc(surface)}</button><span class="gloss-pop" id="${tipId}" role="tooltip">${glossCard(g)}</span></span>`});return `<span class="sentence" data-sentence-index="${n}">${html}</span>`}).join(' ')}</div>`).join('')}
    function latestBlind(lesson){const attempts=progress[lesson.id]||[];return [...attempts].reverse().find(a=>a.blind)||null}
    function renderQuestions(lesson){const last=latestBlind(lesson);const allAttempts=progress[lesson.id]||[];let html=`<section class="quiz-box" aria-labelledby="quiz-title"><div class="section-heading"><div><h3 id="quiz-title">阅读理解自测</h3><p>先自己作答，提交后才显示答案和证据句。</p></div><span class="badge">${lesson.questions.length} 题</span></div>${last?`<p class="status">最近一次盲读自测：${last.score}/${last.total} · ${esc(last.date)}</p>`:''}<p class="status" id="quiz-status" role="status" aria-live="polite"></p>`;
      html+=lesson.questions.map((q,i)=>`<fieldset class="question" style="border:0;padding-left:0;padding-right:0;margin:0"><legend class="question-title"><span class="question-type">${esc(q.type)}</span>${esc(q.q)}</legend><div class="options">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="answer-${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div><div class="feedback hidden" id="feedback-${i}"></div></fieldset>`).join('');
      html+=`<div class="quiz-footer"><p>盲读模式下提交才会记入盲读自测分数。${allAttempts.length?` 已完成 ${allAttempts.length} 次自测。`:''}</p><button class="btn btn-primary" data-action="submit-quiz">提交答案</button></div></section>`;return html}
    function render(){const lesson=current();if(!lesson){app.innerHTML='<p>没有可用课件。</p>';return}document.documentElement.dataset.theme=effectiveTheme();const levels=['B2','B2+','C1'].filter(level=>lessons.some(l=>l.level===level));const levelOptions=['all',...levels].map(level=>`<option value="${level}" ${levelFilter===level?'selected':''}>${level==='all'?'全部等级':level}</option>`).join('');const visibleLessons=lessons.filter(l=>levelFilter==='all'||l.level===levelFilter);const navItems=visibleLessons.map(l=>`<button class="nav-item" data-lesson="${esc(l.id)}" aria-current="${l.id===lesson.id?'page':'false'}"><span class="nav-number">${String(lessons.indexOf(l)+1).padStart(2,'0')}</span><span class="nav-label">${esc(l.title)}<span class="nav-meta">${esc(l.level)} · ${esc(l.genre)}</span></span></button>`).join('');const nav=`<label class="level-filter"><span>按等级筛选</span><select id="level-filter" aria-label="按德语等级筛选课件">${levelOptions}</select></label>${navItems||'<p class="filter-empty">此等级暂无课件。</p>'}`;const blindScore=latestBlind(lesson);const blindCount=(progress[lesson.id]||[]).filter(a=>a.blind).length;
      app.innerHTML=`<header class="topbar"><a class="brand" href="../index.html"><span class="mark">DS</span><span><span class="brand-title">Deutsch Sprint</span><span class="brand-sub">B2–C1 reading studio</span></span></a><div class="actions"><button class="btn btn-secondary" data-action="import">导入 JSON</button><button class="btn btn-secondary" data-action="export">导出本篇 JSON</button><button class="icon" data-action="theme" aria-label="切换明暗主题" title="切换明暗主题">${effectiveTheme()==='dark'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 5.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg>'}</button></div></header>
      <section class="intro"><div><p class="eyebrow">B2–C1 · LESEN</p><h1>读懂句子，也读懂论证</h1><p>精读 · 词块 · 语法聚焦 · 阅读自测</p></div><div class="local-note"><span class="local-dot"></span>课件原创生成 · 仅作练习</div></section>
      <div class="grid"><nav class="lesson-nav" aria-label="课件列表">${nav}<button class="nav-item" data-action="reset-lessons"><span class="nav-number">↺</span><span class="nav-label">恢复内置课件<span class="nav-meta">重置为示例文章</span></span></button></nav>
        <main class="content" id="reader-main" tabindex="-1"><header class="article-head"><div class="article-topline"><div class="badge-row"><span class="badge">${esc(lesson.level)}</span><span class="badge">${esc(lesson.genre)}</span><span class="badge ai">AI 生成 · 仅作练习</span>${lesson.review_status==='ai-generated-unreviewed'?'<span class="badge">待导师抽检</span>':''}</div><span class="article-meta">约 ${wordCount(lesson.text)} 词</span></div><h2>${esc(lesson.title)}</h2><div class="article-meta">${lessons.indexOf(lesson)+1} / ${lessons.length} 篇 · 鼠标悬停或点按标记词查看释义</div><div class="article-controls"><button class="btn" data-action="blind" aria-pressed="${blind}">${blind?'退出盲读模式':'盲读模式'}</button><button class="btn" data-action="summary">${summaryOpen?'隐藏中文摘要':'显示中文摘要'}</button><button class="btn" data-action="export">导出本篇 JSON</button></div><div class="summary"><button class="summary-button" data-action="summary">${summaryOpen?'隐藏中文摘要':'显示中文摘要'}</button><p class="summary-text" ${summaryOpen?'':'hidden'}>${esc(lesson.summary_zh)}</p></div></header>
        <article class="article-box" lang="de"><div class="article-text">${renderText(lesson)}</div></article>${renderQuestions(lesson)}</main>
        <aside class="aside" aria-label="本篇学习信息"><section class="side-box"><h3>盲读自测</h3><div class="metric"><strong>${blindCount}</strong><span>次</span></div><p>先开盲读模式阅读，再完成下方题目。自测分数只保存在当前浏览器。</p>${blindScore?`<span class="score-pill">最近 ${blindScore.score} / ${blindScore.total}</span>`:'<span class="score-pill">尚无记录</span>'}</section><section class="side-box"><h3>语法聚焦</h3><ul class="detail-list">${(lesson.grammar_focus||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="side-box"><h3>回收词块</h3>${lesson.recycled_words?.length?`<div class="recycled">${lesson.recycled_words.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'<p>这是当前词汇链的起始篇。</p>'}</section></aside></div><p class="foot">练习文章为原创 AI 生成文本，不代表新闻报道或真实引语。进度保存在此浏览器。</p>`;
      document.body.classList.toggle('blind',blind);document.querySelectorAll('[data-gloss-toggle]').forEach(b=>{b.disabled=blind;b.tabIndex=blind?-1:0});
      if(visibleResults){showResults(visibleResults);visibleResults=null}
    }
    function showResults(results){const lesson=current();results.forEach((r,i)=>{const q=lesson.questions[i],box=document.getElementById(`feedback-${i}`);if(!box)return;const parts=sentences(lesson.text);const evidence=plainSentence(parts[q.evidence_sentence_index]||'');box.classList.remove('hidden');box.classList.add(r.correct?'correct':'wrong');box.innerHTML=`<strong>${r.correct?'正确':'再看一遍'}</strong> · 正确答案：${esc(q.answer)}<p>证据句：${esc(evidence)}</p>`})}
    function validateCollection(value){const list=Array.isArray(value)?value:Array.isArray(value?.lessons)?value.lessons:[value];if(!list.length)return 'JSON 中没有课件。';for(let i=0;i<list.length;i++){const l=list[i];if(!l||typeof l!=='object'||!l.id||!l.title||!l.text||!Array.isArray(l.glosses)||!Array.isArray(l.questions))return `第 ${i+1} 篇缺少 id、title、text、glosses 或 questions。`;if(l.questions.some(q=>!q.q||!Array.isArray(q.options)||!q.answer||!Number.isInteger(q.evidence_sentence_index)))return `第 ${i+1} 篇的题目格式不完整。`}return ''}
    function exportLesson(){const lesson=current();const blob=new Blob([JSON.stringify(lesson,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`p1-${lesson.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('本篇 JSON 已导出，可交给 P2 卡片工厂。')}
    function importFile(file){const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(String(reader.result||''));const issue=validateCollection(value);if(issue){alert(`导入失败：${issue}`);return}lessons=Array.isArray(value)?value:Array.isArray(value.lessons)?value.lessons:[value];currentId=lessons[0].id;progress={};blind=false;summaryOpen=false;persist();render();toast('课件已导入')}catch{alert('无法读取 JSON，请检查文件格式。')}};reader.readAsText(file)}
    document.addEventListener('click',event=>{const nav=event.target.closest('[data-lesson]');if(nav){currentId=nav.dataset.lesson;blind=false;summaryOpen=false;visibleResults=null;persist();render();return}const action=event.target.closest('[data-action]')?.dataset.action;if(action==='blind'){blind=!blind;document.body.classList.toggle('blind',blind);document.querySelectorAll('[data-gloss-toggle]').forEach(b=>{b.disabled=blind;b.tabIndex=blind?-1:0});const button=document.querySelector('[data-action="blind"]');button.setAttribute('aria-pressed',String(blind));button.textContent=blind?'退出盲读模式':'盲读模式';document.querySelectorAll('.gloss-wrap').forEach(x=>x.classList.remove('open'));return}if(action==='summary'){summaryOpen=!summaryOpen;document.querySelectorAll('.summary-text').forEach(x=>x.hidden=!summaryOpen);document.querySelectorAll('[data-action="summary"]').forEach(x=>x.textContent=summaryOpen?'隐藏中文摘要':'显示中文摘要');return}if(action==='theme'){theme=effectiveTheme()==='dark'?'light':'dark';persist();render();return}if(action==='export'){exportLesson();return}if(action==='import'){document.getElementById('lesson-file').click();return}if(action==='reset-lessons'){if(confirm('恢复内置示例课件？已导入的课件列表会被替换。')){lessons=EMBEDDED.lessons;currentId=lessons[0]?.id;progress={};blind=false;summaryOpen=false;try{localStorage.removeItem(KEY)}catch{}render();toast('已恢复内置课件')}return}const gloss=event.target.closest('[data-gloss-toggle]');if(gloss){if(blind)return;const wrap=gloss.closest('.gloss-wrap');document.querySelectorAll('.gloss-wrap.open').forEach(x=>{if(x!==wrap){x.classList.remove('open');x.querySelector('[data-gloss-toggle]')?.setAttribute('aria-expanded','false')}});const open=wrap.classList.toggle('open');gloss.setAttribute('aria-expanded',String(open));return}if(!event.target.closest('.gloss-wrap'))document.querySelectorAll('.gloss-wrap.open').forEach(x=>{x.classList.remove('open');x.querySelector('[data-gloss-toggle]')?.setAttribute('aria-expanded','false')})});
    document.addEventListener('change',event=>{if(event.target.id==='level-filter'){levelFilter=event.target.value;const visible=lessons.filter(l=>levelFilter==='all'||l.level===levelFilter);if(!visible.some(l=>l.id===currentId)&&visible.length)currentId=visible[0].id;persist();render();return}if(event.target.id==='lesson-file'&&event.target.files?.[0]){importFile(event.target.files[0]);event.target.value=''}});
    document.addEventListener('click',event=>{if(event.target.closest('[data-action="submit-quiz"]')){const lesson=current(),answers=lesson.questions.map((q,i)=>document.querySelector(`input[name="answer-${i}"]:checked`)?.value||'');if(answers.some(x=>!x)){document.getElementById('quiz-status').textContent='请先完成所有题目，再提交。';return}const results=lesson.questions.map((q,i)=>({correct:answers[i]===q.answer}));const score=results.filter(r=>r.correct).length;const today=new Intl.DateTimeFormat('sv-SE').format(new Date());const entry={date:today,score,total:lesson.questions.length,blind};progress[lesson.id]=[...(progress[lesson.id]||[]),entry].slice(-50);persist();visibleResults=results;render();document.getElementById('quiz-title')?.scrollIntoView({behavior:'smooth',block:'start'});toast(blind?'盲读自测成绩已记录':'自测结果已显示');}});
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(theme==='system')render()});
    render();
  })();
  </script>
</body>
